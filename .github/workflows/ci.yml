name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reuse:
    name: REUSE (SPDX headers, D-024)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "reuse==6.2.0"
      - run: reuse lint

  dco:
    name: DCO sign-off (D-040)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check every commit in this PR is signed off by its author or committer
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git log --no-merges --format=%H "$base..$head"); do
            # The sign-off has to be by the commit's author or committer, so nobody
            # signs off in someone else's name, not even by mistake (D-040).
            signoffs=$(git log -1 --format=%B "$sha" | sed -n 's/^Signed-off-by: *\(.*[^[:space:]]\)[[:space:]]*$/\1/p')
            author=$(git log -1 --format='%an <%ae>' "$sha")
            committer=$(git log -1 --format='%cn <%ce>' "$sha")
            if ! grep -qixF -e "$author" -e "$committer" <<< "$signoffs"; then
              echo "::error::Commit $sha has no 'Signed-off-by' trailer by its author ($author) or committer ($committer) (DCO, D-040). Run: git rebase --signoff $base"
              missing=1
            fi
          done
          exit $missing

  # Formatting, lints and tests run in the same KDE Flatpak SDK with the Rust
  # extension that developers use through tools/sdk.sh (D-063).
  rust:
    name: Rust format, lints and tests (KDE SDK, D-063)
    runs-on: ubuntu-latest
    container:
      # The KDE Flatpak runtime and SDK 6.11, pinned (D-025).
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner creates the workspace as its own user, and bubblewrap drops
      # all capabilities in the Flatpak sandbox, so root in there can only
      # write where it owns the files, e.g. Cargo's target directory.
      - name: Give the checkout to the container's user
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Install the Rust SDK extension
        run: flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Formatting
        run: tools/sdk.sh cargo fmt --all --check
      - name: Lints
        run: tools/sdk.sh cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: tools/sdk.sh cargo test --workspace --locked
      - name: Tests with the system's SQLite instead of the bundled one (D-061)
        run: tools/sdk.sh cargo test --package kassensturz-store --no-default-features --locked
      - name: Translations are valid
        run: tools/sdk.sh sh -c 'for po in po/*/kassensturz.po; do msgfmt --check --output-file=/dev/null "$po"; done'

  # Windows is the next platform after KDE Plasma and GNOME (D-006). Qt and
  # KDE Frameworks aren't set up on this runner yet, so it covers everything
  # except the app crate (kassensturz-ui-bridge); the Qt build joins in when
  # Windows packaging does (M7). The Rust version is the one in the KDE SDK's
  # Rust extension (D-073).
  windows:
    name: Windows lints and tests (D-090)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
      - name: Lints
        run: cargo clippy --workspace --exclude kassensturz-ui-bridge --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude kassensturz-ui-bridge --locked

  # macOS is the last platform in D-006's order and has no official packages
  # until its signing is funded (D-048), but a macOS-only problem is cheaper to
  # fix now than after M3 has grown. It covers the same crates as the Windows
  # job and needs no Apple developer account; Qt and KDE Frameworks on macOS
  # wait for macOS packaging (M7).
  macos:
    name: macOS lints and tests (D-090)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
      - name: Lints
        run: cargo clippy --workspace --exclude kassensturz-ui-bridge --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude kassensturz-ui-bridge --locked

  # The app built the way a Debian-style package is: Kubuntu's own Qt, KDE
  # Frameworks and SQLite from the distribution's archive, installed into a
  # staging folder (D-094). Only Rust comes from elsewhere: the distribution's
  # rustc is older than the project's 1.98 (D-073), so the distribution's
  # `rustup` package installs 1.98.1. Kubuntu is Ubuntu plus the KDE packages,
  # all of them in the same archive, so Ubuntu's image is enough.
  kubuntu:
    name: Kubuntu 26.10 with distribution packages (D-094)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.10@sha256:93e29beff5257b2cdf1c024d831f6d2997e53655a653ff76a811fc9e6564a719
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install the distribution's build tools, Qt, KDE Frameworks and SQLite
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl extra-cmake-modules gettext git \
            libkf6i18n-dev libkf6qqc2desktopstyle-dev libsqlite3-dev ninja-build pkgconf \
            qml6-module-org-kde-desktop qml6-module-org-kde-ki18n qml6-module-org-kde-kirigami \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools rustup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      # Kubuntu 26.10 has Qt 6.11.2 but KDE Frameworks 6.29.0, one release
      # short of the 6.30.0 that CMakeLists.txt asks for by default, so this
      # job asks for 6.29.0 (D-094). It uses the system's SQLite (D-061).
      - name: Configure
        run: cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DKASSENSTURZ_BUNDLED_SQLITE=OFF -DKF_MIN_VERSION=6.29.0
      - name: Build
        run: cmake --build build/cmake
      - name: Install into a staging folder
        run: DESTDIR="$PWD/build/stage" cmake --install build/cmake
      - name: Tests, with the system's SQLite
        run: cargo test --workspace --no-default-features --locked
        env:
          QMAKE: /usr/bin/qmake6
      # The window opens and keeps running; timeout ends it with status 124.
      # A missing QML module or a crash at start-up ends it sooner.
      - name: The installed app starts
        run: |
          status=0
          timeout 10 build/stage/usr/bin/kassensturz || status=$?
          test "$status" -eq 124

  licenses:
    name: Dependency licenses and sources (D-026)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: licenses sources

  # Builds the Flatpak offline from the manifest and uploads it, so every build
  # can be installed (D-068).
  flatpak:
    name: Flatpak (D-068)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/io.github.vondor.KassenSturz.yml
          bundle: KassenSturz.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
