name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request ends the run of the older commit, which nobody
# reads any more (D-220). Pushes to main are never cancelled: each has its own
# group (the run's ID), because a group with a waiting run would drop the older
# one, and main's runs seed the caches and build the Flatpak people install.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Order of work (D-110): the quick checks (REUSE, DCO, licenses, formatting) run
# first and take about a minute, so the common mistakes show up before any slow
# job has started; the slow jobs wait for them and then run side by side. A pull
# request that only changes documentation skips the slow jobs: a job skipped by
# its own `if` counts as passed for branch protection, so the checks it requires
# still report (a workflow-level `paths-ignore` would leave them pending forever).
jobs:
  # Decides whether the slow jobs have anything to build. Everything that isn't
  # plainly documentation counts as code, and so does every push to main.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$BASE...$HEAD")
            # docs/ERROR_CODES.md is compiled into the tests of kassensturz-store,
            # so it's code. The other documentation, the licenses, the GitHub
            # templates and the Markdown files in the top folder are not.
            not_docs=$(grep -Ev '^(docs/|LICENSES/|[^/]+\.md$|REUSE\.toml$|CODEOWNERS$|\.github/ISSUE_TEMPLATE/|\.github/PULL_REQUEST_TEMPLATE\.md$)' <<< "$files" || true)
            error_codes=$(grep -x 'docs/ERROR_CODES.md' <<< "$files" || true)
            if [ -n "$files" ] && [ -z "$not_docs$error_codes" ]; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Slow jobs needed: $code"

  reuse:
    name: REUSE (SPDX headers, D-024)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "reuse==6.2.0"
      - run: reuse lint

  # Runs on pushes too, with nothing to check, so that the slow jobs can wait
  # for it (a job that was skipped would skip them as well).
  dco:
    name: DCO sign-off (D-040)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Check every commit in this PR is signed off by its author or committer
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git log --no-merges --format=%H "$base..$head"); do
            # The sign-off has to be by the commit's author or committer, so nobody
            # signs off in someone else's name, not even by mistake (D-040).
            signoffs=$(git log -1 --format=%B "$sha" | sed -n 's/^Signed-off-by: *\(.*[^[:space:]]\)[[:space:]]*$/\1/p')
            author=$(git log -1 --format='%an <%ae>' "$sha")
            committer=$(git log -1 --format='%cn <%ce>' "$sha")
            if ! grep -qixF -e "$author" -e "$committer" <<< "$signoffs"; then
              echo "::error::Commit $sha has no 'Signed-off-by' trailer by its author ($author) or committer ($committer) (DCO, D-040). Run: git rebase --signoff $base"
              missing=1
            fi
          done
          exit $missing

  # Formatting needs nothing but rustfmt, so it runs on its own and answers in
  # seconds instead of waiting for the KDE container. The Rust extension in the
  # SDK ships the same release (D-073), so both format alike.
  fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
      - run: cargo fmt --all --check

  # Formatting, lints and tests run in the same KDE Flatpak SDK with the Rust
  # extension that developers use through tools/sdk.sh (D-063).
  rust:
    name: Rust format, lints and tests (KDE SDK, D-063)
    runs-on: ubuntu-latest
    needs: [changes, reuse, dco, licenses, fmt]
    if: needs.changes.outputs.code == 'true'
    container:
      # The KDE Flatpak runtime and SDK 6.11, pinned (D-025).
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust SDK extension
        run: flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//25.08
      # Cargo's downloads and build output are kept between runs, per Rust
      # release and Cargo.lock (D-110). Without incremental builds, which a
      # cache wouldn't use again, the saved folder stays smaller.
      - name: Set up Cargo's cache
        id: rustc
        run: |
          mkdir -p .sdk-cache/cargo
          printf '[build]\nincremental = false\n' > .sdk-cache/cargo/config.toml
          echo "version=$(tools/sdk.sh rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo's cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .sdk-cache/cargo/registry
            .sdk-cache/cargo/git
            target
          key: cargo-kde-sdk-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-kde-sdk-${{ steps.rustc.outputs.version }}-
      # The runner creates the workspace as its own user, and bubblewrap drops
      # all capabilities in the Flatpak sandbox, so root in there can only
      # write where it owns the files, e.g. Cargo's target directory.
      - name: Give the checkout to the container's user
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Formatting
        run: tools/sdk.sh cargo fmt --all --check
      - name: Lints
        run: tools/sdk.sh cargo clippy --workspace --all-targets --locked -- -D warnings
      # The charts of M6 use KQuickCharts as a QML module of the KDE runtime
      # (D-275). It is not built from source, so what the runtime ships is
      # what the app gets: fail here if it is missing, and say which release.
      - name: KQuickCharts is in the KDE runtime (D-275)
        run: |
          tools/sdk.sh sh -c 'dir=$(find /usr -path "*org/kde/quickcharts/qmldir" -print -quit); test -n "$dir" && echo "$dir" && cat "$(dirname "$dir")/kde-qmlmodule.version"'
      - name: Tests
        run: tools/sdk.sh cargo test --workspace --locked
      - name: Tests with the system's SQLite instead of the bundled one (D-061)
        run: tools/sdk.sh cargo test --package kassensturz-store --no-default-features --locked
      - name: Translations are valid, complete and current (D-126)
        run: tools/sdk.sh tools/check-translations.sh
      # Saved even when a check failed, so the next push doesn't start cold.
      # Only main saves (D-427): a pull request's copies probably help push
      # main's out of GitHub's 10 GB limit, and main then starts cold.
      - name: Save Cargo's cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .sdk-cache/cargo/registry
            .sdk-cache/cargo/git
            target
          key: cargo-kde-sdk-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}

  # The build without AI (D-039): lints and tests of every crate with the AI
  # feature off, and a check that no AI crate is in what it builds. It is a job
  # of its own so that it runs beside the KDE job and not after it (D-220); the
  # KDE job keeps its name, the new check is "Build without AI (D-039)". Its
  # Cargo cache has a name of its own, because the two builds don't share
  # compiled crates.
  no-ai:
    name: Build without AI (D-039)
    runs-on: ubuntu-latest
    needs: [changes, reuse, dco, licenses, fmt]
    if: needs.changes.outputs.code == 'true'
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust SDK extension
        run: flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Set up Cargo's cache
        id: rustc
        run: |
          mkdir -p .sdk-cache/cargo
          printf '[build]\nincremental = false\n' > .sdk-cache/cargo/config.toml
          echo "version=$(tools/sdk.sh rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo's cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .sdk-cache/cargo/registry
            .sdk-cache/cargo/git
            target
          key: cargo-kde-sdk-no-ai-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-kde-sdk-no-ai-${{ steps.rustc.outputs.version }}-
      - name: Give the checkout to the container's user
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Lints, build without AI (D-039)
        run: tools/sdk.sh cargo clippy --workspace --all-targets --no-default-features --features bundled-sqlite --locked -- -D warnings
      - name: Tests, build without AI (D-039)
        run: tools/sdk.sh cargo test --workspace --no-default-features --features bundled-sqlite --locked
      - name: The build without AI holds no AI crate (D-039)
        run: tools/sdk.sh tools/check-no-ai.sh
      # Saved even when a check failed, so the next push doesn't start cold.
      - name: Save Cargo's cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .sdk-cache/cargo/registry
            .sdk-cache/cargo/git
            target
          key: cargo-kde-sdk-no-ai-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}

  # Windows is the next platform after KDE Plasma and GNOME (D-006). Qt and
  # KDE Frameworks aren't set up on this runner yet, so it covers everything
  # except the app crate (kassensturz-ui-bridge); the Qt build joins in when
  # Windows packaging does (M7). The Rust version is the one in the KDE SDK's
  # Rust extension (D-073).
  windows:
    name: Windows lints and tests (D-090)
    runs-on: windows-latest
    needs: [changes, reuse, dco, licenses, fmt]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
      # Cargo's downloads and build output are kept between runs, per Rust
      # release and Cargo.lock, as in the Linux jobs (D-110). The build
      # output is large here: the AI crates bring AWS-LC (M5.W).
      - name: Restore Cargo's cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-1.98.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-windows-1.98.1-
      - name: Lints
        run: cargo clippy --workspace --exclude kassensturz-ui-bridge --all-targets --locked -- -D warnings
        env:
          CARGO_INCREMENTAL: "0"
      - name: Tests
        run: cargo test --workspace --exclude kassensturz-ui-bridge --locked
        env:
          CARGO_INCREMENTAL: "0"
      - name: Save Cargo's cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-1.98.1-${{ hashFiles('Cargo.lock') }}

  # macOS is the last platform in D-006's order and has no official packages
  # until its signing is funded (D-048), but a macOS-only problem is cheaper to
  # fix now than after M3 has grown. It covers the same crates as the Windows
  # job and needs no Apple developer account; Qt and KDE Frameworks on macOS
  # wait for macOS packaging (M7).
  macos:
    name: macOS lints and tests (D-090)
    runs-on: macos-latest
    needs: [changes, reuse, dco, licenses, fmt]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
      - name: Lints
        run: cargo clippy --workspace --exclude kassensturz-ui-bridge --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude kassensturz-ui-bridge --locked

  # The app built the way a Debian-style package is: Kubuntu's own Qt, KDE
  # Frameworks and SQLite from the distribution's archive, installed into a
  # staging folder (D-094). Only Rust comes from elsewhere: the distribution's
  # rustc is older than the project's 1.98 (D-073), so the distribution's
  # `rustup` package installs 1.98.1. Kubuntu is Ubuntu plus the KDE packages,
  # all of them in the same archive, so Ubuntu's image is enough.
  kubuntu:
    name: Kubuntu 26.10 with distribution packages (D-094)
    runs-on: ubuntu-latest
    needs: [changes, reuse, dco, licenses, fmt]
    if: needs.changes.outputs.code == 'true'
    container:
      image: ubuntu:26.10@sha256:93e29beff5257b2cdf1c024d831f6d2997e53655a653ff76a811fc9e6564a719
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen
      CARGO_INCREMENTAL: "0"
    steps:
      # zstd lets the cache action pack Cargo's folder in seconds, not minutes.
      - name: Install the distribution's build tools, Qt, KDE Frameworks and SQLite
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl extra-cmake-modules gettext git \
            libkf6config-dev libkf6i18n-dev libkf6qqc2desktopstyle-dev libsqlite3-dev ninja-build pkgconf \
            qml6-module-org-kde-desktop qml6-module-org-kde-ki18n qml6-module-org-kde-kirigami \
            qml6-module-org-kde-kirigamiaddons-formcard qml6-module-qtquick-dialogs \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools rustup zstd \
            libaqbanking-dev libgwenhywfar-core-dev libgwengui-qt6-dev \
            python3-minimal qml-qt6 qml6-module-org-kde-quickcharts qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript xvfb libgl1-mesa-dri
      # The versions the bindings were made for (D-138); the Rust test below
      # loads the libraries by their ABI names.
      - name: AqBanking and Gwenhywfar are the pinned versions
        run: |
          pkg-config --modversion aqbanking gwenhywfar gwengui-qt6
          test "$(pkg-config --modversion aqbanking)" = 6.9.2
          test "$(pkg-config --modversion gwenhywfar)" = 5.14.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # In a container, `github.workspace` is the runner's path, not the
      # container's, so Cargo's folder is named here.
      - name: Keep Cargo's files in the workspace, where the cache reaches them
        run: echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo-home" >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Remember the Rust version, for the cache's name
        id: rustc
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      # Cargo's downloads and build output are kept between runs (D-110).
      - name: Restore Cargo's cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            build/cmake/cargo
            target
          key: cargo-kubuntu-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-kubuntu-${{ steps.rustc.outputs.version }}-
      # Kubuntu 26.10 has Qt 6.11.2 and KDE Frameworks 6.29.0, the minimums in
      # CMakeLists.txt (D-094). It uses the system's SQLite (D-061).
      - name: Configure
        run: cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DKASSENSTURZ_BUNDLED_SQLITE=OFF
      - name: Build
        run: cmake --build build/cmake
      # The library for Gwenhywfar's Qt dialogs and its test (M4.2, D-140).
      - name: The bank dialog library is built and passes its test
        run: |
          test -f build/cmake/crates/kassensturz-aqbanking-sys/gwengui/libkassensturz-gwengui.so
          ctest --test-dir build/cmake --output-on-failure
      - name: Install into a staging folder
        run: DESTDIR="$PWD/build/stage" cmake --install build/cmake
      # Without its catalog the app would speak English on a German system.
      - name: The German translation is installed (D-126)
        run: test -f build/stage/usr/share/locale/de/LC_MESSAGES/kassensturz.mo
      # The desktop file names the icon, and the icon theme has it (D-165).
      - name: The app icon is installed (D-165)
        run: |
          set -eu
          icons=build/stage/usr/share/icons/hicolor
          test -s "$icons/scalable/apps/io.github.vondor.KassenSturz.svg"
          for size in 16 22 24 32 48 64 128 256; do
            test -s "$icons/${size}x${size}/apps/io.github.vondor.KassenSturz.png"
          done
          grep -qx 'Icon=io.github.vondor.KassenSturz' \
            build/stage/usr/share/applications/io.github.vondor.KassenSturz.desktop
      # The MCP server comes with the build with AI, and like the app's AI it
      # doesn't run while AI is off, which a fresh settings folder means
      # (D-013, D-050, D-194).
      - name: The MCP server is installed and refuses to start while AI is off (D-194)
        run: |
          set -eu
          status=0
          HOME="$PWD/build/mcp-home" XDG_CONFIG_HOME="$PWD/build/mcp-home/.config" \
            build/stage/usr/bin/kassensturz-mcp < /dev/null || status=$?
          test "$status" -eq 2
      # KQuickCharts draws the charts (D-275). It is a QML module the app
      # imports at run time, so nothing else in this job would notice it
      # missing; this draws every chart kind and looks at the pictures (M6a.4).
      - name: KQuickCharts is installed and draws every chart kind (D-275)
        run: tools/check-charts.sh
      # The properties panel (M6a.6) and the Statistics page (M6a.7) load and
      # click through on stand-ins for the Rust objects.
      - name: The properties panel and the Statistics page load and work
        run: tools/check-panel.sh
      # Every handler of a user's action says that it ran in the developer
      # mode's debug log (M6c.D, D-419); the same check runs as a unit test.
      - name: Every action handler names its action in the debug log
        run: tools/check-action-log.sh
      - name: Tests, with the system's SQLite
        run: cargo test --workspace --no-default-features --features ai --locked
        env:
          QMAKE: /usr/bin/qmake6
          # The distribution's AqBanking is installed, so the loading test
          # must find it (D-138).
          KASSENSTURZ_REQUIRE_AQBANKING: "1"
      # The window opens and keeps running; timeout ends it with status 124.
      # A missing QML module or a crash at start-up ends it sooner.
      - name: The installed app starts
        run: |
          status=0
          timeout 10 build/stage/usr/bin/kassensturz || status=$?
          test "$status" -eq 124
      - name: Save Cargo's cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            build/cmake/cargo
            target
          key: cargo-kubuntu-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}

  # The same build with Fedora's packages, groundwork for an RPM (D-097).
  # Fedora 44 is the current stable release; Fedora 45 is not out yet. Qt, KDE
  # Frameworks and SQLite come from Fedora's repositories; only Rust comes
  # from elsewhere, as on Kubuntu: the distribution's `rustup` package
  # installs 1.98.1 (D-073).
  fedora:
    name: Fedora 44 with distribution packages (D-097)
    runs-on: ubuntu-latest
    needs: [changes, reuse, dco, licenses, fmt]
    if: needs.changes.outputs.code == 'true'
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    env:
      QT_QPA_PLATFORM: offscreen
      CARGO_INCREMENTAL: "0"
    steps:
      # Kirigami Addons is named by the file it installs: Fedora 44 has no
      # package called kirigami-addons, and its name couldn't be checked
      # beforehand (D-112). KQuickCharts, which the Overview's chart imports at
      # run time (M6a.8, D-275), is named by its file in the same way.
      - name: Install the distribution's build tools, Qt, KDE Frameworks and SQLite
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake dejavu-sans-fonts extra-cmake-modules gcc-c++ gettext git \
            kf6-kconfig-devel kf6-ki18n kf6-ki18n-devel kf6-kirigami kf6-kirigami-devel \
            kf6-kquickcharts kf6-qqc2-desktop-style ninja-build \
            pkgconf-pkg-config qt6-qtbase-devel qt6-qtdeclarative \
            qt6-qtdeclarative-devel rustup sqlite-devel tar \
            /usr/lib64/qt6/qml/org/kde/kirigamiaddons/formcard/qmldir \
            /usr/lib64/qt6/qml/org/kde/quickcharts/qmldir \
            aqbanking-devel gwenhywfar-devel gwenhywfar-gui-qt6-devel
      # Recorded in docs/THIRD_PARTY.md (D-138).
      - name: Fedora's AqBanking and Gwenhywfar versions
        run: rpm -qa --qf '%{NAME} %{VERSION}-%{RELEASE} %{LICENSE}\n' 'aqbanking*' 'gwenhywfar*' 'libchipcard*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # In a container, `github.workspace` is the runner's path, not the
      # container's, so Cargo's folder is named here.
      - name: Keep Cargo's files in the workspace, where the cache reaches them
        run: echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo-home" >> "$GITHUB_ENV"
      # Fedora's rustup package only has the installer, which puts cargo and
      # rustc in $CARGO_HOME/bin.
      - name: Install Rust
        run: |
          rustup-init -y --profile minimal --default-toolchain 1.98.1
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Remember the Rust version, for the cache's name
        id: rustc
        run: echo "version=$("$CARGO_HOME/bin/rustc" --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      # Cargo's downloads and build output are kept between runs (D-110).
      - name: Restore Cargo's cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            build/cmake/cargo
            target
          key: cargo-fedora-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-fedora-${{ steps.rustc.outputs.version }}-
      # Fedora 44 has Qt 6.11 and KDE Frameworks 6.29 or newer, the minimums in
      # CMakeLists.txt (D-094). It uses the system's SQLite (D-061).
      - name: Configure
        run: cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DKASSENSTURZ_BUNDLED_SQLITE=OFF
      - name: Build
        run: cmake --build build/cmake
      # The library for Gwenhywfar's Qt dialogs and its test (M4.2, D-140).
      - name: The bank dialog library is built and passes its test
        run: |
          test -f build/cmake/crates/kassensturz-aqbanking-sys/gwengui/libkassensturz-gwengui.so
          ctest --test-dir build/cmake --output-on-failure
      - name: Install into a staging folder
        run: DESTDIR="$PWD/build/stage" cmake --install build/cmake
      # Without its catalog the app would speak English on a German system.
      - name: The German translation is installed (D-126)
        run: test -f build/stage/usr/share/locale/de/LC_MESSAGES/kassensturz.mo
      # The desktop file names the icon, and the icon theme has it (D-165).
      - name: The app icon is installed (D-165)
        run: |
          set -eu
          icons=build/stage/usr/share/icons/hicolor
          test -s "$icons/scalable/apps/io.github.vondor.KassenSturz.svg"
          for size in 16 22 24 32 48 64 128 256; do
            test -s "$icons/${size}x${size}/apps/io.github.vondor.KassenSturz.png"
          done
          grep -qx 'Icon=io.github.vondor.KassenSturz' \
            build/stage/usr/share/applications/io.github.vondor.KassenSturz.desktop
      # The MCP server comes with the build with AI, and like the app's AI it
      # doesn't run while AI is off, which a fresh settings folder means
      # (D-013, D-050, D-194).
      - name: The MCP server is installed and refuses to start while AI is off (D-194)
        run: |
          set -eu
          status=0
          HOME="$PWD/build/mcp-home" XDG_CONFIG_HOME="$PWD/build/mcp-home/.config" \
            build/stage/usr/bin/kassensturz-mcp < /dev/null || status=$?
          test "$status" -eq 2
      # The same Rust tests run on Kubuntu on every pull request; here they run
      # on main only, since this job adds Fedora's libraries, which the build,
      # the install and the start above already try (D-220).
      - name: Tests, with the system's SQLite
        if: github.event_name == 'push'
        run: cargo test --workspace --no-default-features --features ai --locked
        env:
          QMAKE: /usr/bin/qmake6
          # The distribution's AqBanking is installed, so the loading test
          # must find it (D-138).
          KASSENSTURZ_REQUIRE_AQBANKING: "1"
      # The window opens and keeps running; timeout ends it with status 124.
      # A missing QML module or a crash at start-up ends it sooner.
      - name: The installed app starts
        run: |
          status=0
          timeout 10 build/stage/usr/bin/kassensturz || status=$?
          test "$status" -eq 124
      - name: Save Cargo's cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            build/cmake/cargo
            target
          key: cargo-fedora-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}

  licenses:
    name: Dependency licenses and sources (D-026)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: licenses sources

  # After a merge, the Flatpak that the pull request already built and tested
  # is used again when it was made from exactly the files now on main and has
  # main's build number; otherwise the next job builds it as before (D-427).
  # A pull request's own run skips the steps and says `reused=false`.
  flatpak-reuse:
    name: Flatpak from the pull request (D-427)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - id: reuse
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tools/ci-flatpak-reuse.sh reused
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
      # Same name as the Flatpak job's bundle, so whoever installs the build
      # of a commit on main finds it in the same place.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.reuse.outputs.reused == 'true'
        with:
          name: KassenSturz-x86_64.flatpak
          path: reused/KassenSturz.flatpak
          if-no-files-found: error

  # Builds the Flatpak offline from the manifest and uploads it, so every build
  # can be installed (D-068).
  flatpak:
    name: Flatpak (D-068)
    runs-on: ubuntu-latest
    needs: [changes, reuse, dco, licenses, fmt, flatpak-reuse]
    if: needs.changes.outputs.code == 'true' && needs.flatpak-reuse.outputs.reused != 'true'
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
    steps:
      # The whole history, since the build's number counts merges (D-226).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The Flatpak's copy of the sources has no .git, so the commit goes in a
      # file that build.rs reads; Settings then shows it next to the version.
      # In a pull request this is the branch's own last commit, which exists
      # on GitHub, not the temporary merge commit the run is made from.
      - name: Note the commit for the build
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "${COMMIT}" | cut -c1-7 > build-commit
          sh tools/build-version.sh > build-version
      # The builder's own folder is kept between runs with the same cache
      # action as Cargo's (D-110), not with the Flatpak action's built-in
      # cache: on main the built-in one did not bring back the last build
      # when the key had changed, and its restore line is not visible. The key
      # changes with the manifest and cargo-sources.json, so a new crate list
      # is saved, and `restore-keys` starts it from the newest earlier cache
      # (D-220). The next step's name shows what was restored.
      - name: Restore the builder's cache
        id: builder-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flatpak-builder
          key: flatpak-builder-state-x86_64-${{ hashFiles('packaging/flatpak/**') }}
          restore-keys: flatpak-builder-state-x86_64-
      - name: "Builder cache restored from: ${{ steps.builder-cache.outputs.cache-matched-key || 'nothing' }}"
        run: ls .flatpak-builder 2>/dev/null | head || true
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/io.github.vondor.KassenSturz.yml
          bundle: KassenSturz.flatpak
          restore-cache: false
          save-cache: false
      # What this bundle was made from, so that the run after the merge can
      # tell whether it may use the bundle again (D-427).
      - name: Note what the build was made from
        if: github.event_name == 'pull_request'
        run: |
          mkdir flatpak-build-info
          git rev-parse 'HEAD^{tree}' > flatpak-build-info/tree
          cp build-version flatpak-build-info/version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: flatpak-build-info
          path: flatpak-build-info
          if-no-files-found: error
      # Saved even when a later check fails, so the next push doesn't start cold.
      - name: Save the builder's cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.builder-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flatpak-builder
          key: flatpak-builder-state-x86_64-${{ hashFiles('packaging/flatpak/**') }}
      # Installed from the bundle that people get, since a catalog in the build
      # but not in the bundle left the Flatpak in English on a German system
      # (D-128).
      - name: The German translation is in the Flatpak (D-128)
        run: |
          set -eu
          flatpak=$(command -v flatpak || echo /app/bin/flatpak)
          "$flatpak" install --user --noninteractive --bundle KassenSturz.flatpak
          where=$("$flatpak" info --show-location io.github.vondor.KassenSturz)
          test -f "$where/files/share/locale/de/LC_MESSAGES/kassensturz.mo"
      # The icon is in the bundle, and the desktop file asks for it by name,
      # which is what shows the launcher and the window its icon (D-165).
      - name: The app icon is in the Flatpak (D-165)
        run: |
          set -eu
          flatpak=$(command -v flatpak || echo /app/bin/flatpak)
          files="$("$flatpak" info --show-location io.github.vondor.KassenSturz)/files"
          icons="$files/share/icons/hicolor"
          for size in 16 22 24 32 48 64 128 256; do
            test -s "$icons/${size}x${size}/apps/io.github.vondor.KassenSturz.png"
          done
          # Only the PNG sizes: AppStream in the build image can't read SVG.
          test ! -e "$icons/scalable"
          grep -qx 'Icon=io.github.vondor.KassenSturz' \
            "$files/share/applications/io.github.vondor.KassenSturz.desktop"
      # The user's AI tool starts the MCP server with
      # `flatpak run --command=kassensturz-mcp io.github.vondor.KassenSturz`
      # (D-194, docs/user/NOTES.md).
      - name: The MCP server is in the Flatpak (D-194)
        run: |
          set -eu
          flatpak=$(command -v flatpak || echo /app/bin/flatpak)
          test -x "$("$flatpak" info --show-location io.github.vondor.KassenSturz)/files/bin/kassensturz-mcp"
      # The MCP write tools reach the running app through a request folder in
      # the app's data folder, with no socket and no new permission (Q-124 A,
      # D-216, D-219). The AI tool starts the server as another instance of
      # the app, each in a sandbox of its own, so this proves the instances
      # share the folder: the server makes it and names it, another instance
      # writes into it, a third finds that at the place the server named.
      - name: Instances of the Flatpak share the MCP request folder (D-219)
        run: |
          set -eu
          flatpak=$(command -v flatpak || echo /app/bin/flatpak)
          app=io.github.vondor.KassenSturz
          XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_RUNTIME_DIR
          mkdir -p "$HOME/.var/app/$app/config"
          printf '[AI]\nEnabled=true\nMcpWriteTools=true\n' > "$HOME/.var/app/$app/config/kassensturzrc"
          "$flatpak" run --command=kassensturz-mcp "$app" --request-folder > named.txt 2>&1 || { cat named.txt; exit 1; }
          cat named.txt
          named=$(sed -n 's/^request folder: //p' named.txt)
          host="$HOME/.var/app/$app/data/$app/mcp-requests"
          test "$named" = "$host"
          test "$(stat -c %a "$host")" = 700
          "$flatpak" run --command=sh "$app" -c \
            'echo probe > "$XDG_DATA_HOME/io.github.vondor.KassenSturz/mcp-requests/probe"'
          test "$(cat "$host/probe")" = probe
          "$flatpak" run --command=sh "$app" -c "test -f '$named/probe'"
          rm -r "$HOME/.var/app/$app"
          echo "MCP request folder shared: $named"
      # Network, the Secret Service, KeePassXC's browser socket (D-164) and
      # the card reader are the only permissions beyond a window (D-142); a
      # new one must change this list.
      # The KDE runtime adds its own: reading the desktop's kdeglobals and
      # three of KDE's settings and menu services.
      - name: The Flatpak's permissions are the approved ones (D-142)
        run: |
          set -eu
          flatpak=$(command -v flatpak || echo /app/bin/flatpak)
          "$flatpak" info --show-permissions io.github.vondor.KassenSturz | grep -v '^$' > permissions.txt
          cat > expected.txt <<'LIST'
          [Context]
          shared=ipc;network;
          sockets=fallback-x11;pcsc;wayland;
          devices=dri;
          filesystems=xdg-config/kdeglobals:ro;xdg-run/app/org.keepassxc.KeePassXC:create;
          [Session Bus Policy]
          com.canonical.AppMenu.Registrar=talk
          org.kde.kconfig.notify=talk
          org.kde.KGlobalSettings=talk
          org.freedesktop.secrets=talk
          [Environment]
          QT_LOGGING_RULES=kf.solid.backends.udisks2.warning=false
          LIST
          diff -u expected.txt permissions.txt
      # The bank libraries are in the bundle, built as D-142 says, and the
      # command-line tools that could send payments are not (D-053).
      - name: AqBanking is bundled for bank connections (D-054, D-142)
        run: |
          set -eu
          flatpak=$(command -v flatpak || echo /app/bin/flatpak)
          files="$("$flatpak" info --show-location io.github.vondor.KassenSturz)/files"
          for library in libaqbanking.so.44 libgwenhywfar.so.79 libgwengui-qt6.so.79 \
              libchipcard.so.6 libpcsclite.so.1 libpcsclite_real.so.1 kassensturz/libkassensturz-gwengui.so; do
            test -e "$files/lib/$library"
          done
          test -s "$files/share/aqbanking/bankinfo/de/banks.data"
          plugins="$files/lib/aqbanking/plugins/44"
          test "$(ls "$plugins/providers" | tr '\n' ' ')" = "aqhbci.xml aqnone.xml "
          test -f "$plugins/imexporters/swift.xml"
          test ! -e "$plugins/imexporters/eri2.xml"
          # Only the app and its MCP server (D-194): no AqBanking tool.
          test "$(ls "$files/bin" | tr '\n' ' ')" = "kassensturz kassensturz-mcp "
          # Gwenhywfar checks a bank's certificate against this file only.
          runtime="$("$flatpak" info --show-location org.kde.Platform//6.11)/files"
          test -s "$runtime/etc/ssl/certs/ca-certificates.crt"
