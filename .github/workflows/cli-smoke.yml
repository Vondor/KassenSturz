name: CLI smoke tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/test-cli-smoke.sh'
      - '.github/workflows/cli-smoke.yml'
permissions:
  contents: read
jobs:
  cli-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Synthetic CLI smoke test
        run: bash tools/test-cli-smoke.sh
