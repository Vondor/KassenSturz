name: macOS app (experimental)

# The experimental, UNSIGNED macOS download (D-875): KDE Craft brings Qt 6 and
# KDE Frameworks from its binary cache, builds KassenSturz with the project's
# CMake (which drives Cargo, D-063), packaging/macos/make-dmg.sh makes the
# .app and a .dmg, and this file starts the app from the .dmg as the only
# check, since nobody on the team has a Mac. There is no Apple Developer
# account: the app is ad-hoc signed, not notarized, and docs/MACOS.md tells
# the person how to open it anyway. Apple Silicon only (the runner's chip).
#
# It does not run on every pull request (macOS minutes cost ten times a Linux
# minute): only for a change to its own files, a push of those to main (which
# fills the cache), a manual start and a pre-release tag (release.yml). A
# failure here never stops a release: release.yml attaches the .dmg after the
# release exists, and only if this workflow succeeded.

on:
  pull_request:
    paths:
      - ".github/workflows/macos-app.yml"
      - "packaging/macos/**"
      - "CMakeLists.txt"
      - "crates/kassensturz-ui-bridge/build.rs"
      - "crates/kassensturz-ui-bridge/cpp/platform.cpp"
  push:
    branches: [main]
    paths:
      - ".github/workflows/macos-app.yml"
      - "packaging/macos/**"
      - "CMakeLists.txt"
      - "crates/kassensturz-ui-bridge/build.rs"
      - "crates/kassensturz-ui-bridge/cpp/platform.cpp"
  workflow_dispatch:
  # release.yml calls this workflow for a pre-release tag.
  workflow_call:
    inputs:
      release:
        description: Upload the .dmg as macos-dmg-for-release for the job that attaches it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CRAFT_ROOT: /Users/runner/CraftRoot
  # The same pinned Craft and blueprints as the Windows app (windows-app.yml),
  # moved on together.
  CRAFT_COMMIT: 911cb3f55b2ce0cb95c6a0013678028190a34a66
  CRAFT_BLUEPRINTS_COMMIT: 0cb3f8cd34e5ce8527c278537825fb2315704496
  CARGO_INCREMENTAL: "0"

jobs:
  macos-app:
    name: macOS app with KDE Craft (D-875)
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tools/build-version.sh counts the day's commits (D-226).
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Machine
        run: |
          uname -m
          sw_vers
          xcodebuild -version
      - name: Restore Craft
        id: craft-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /Users/runner/CraftRoot
            !/Users/runner/CraftRoot/build
            !/Users/runner/CraftRoot/download
            !/Users/runner/CraftRoot/tmp
          key: craft-macos-v1-${{ env.CRAFT_COMMIT }}-${{ env.CRAFT_BLUEPRINTS_COMMIT }}-${{ hashFiles('packaging/macos/craft/**/*.py') }}
          restore-keys: craft-macos-v1-${{ env.CRAFT_COMMIT }}-${{ env.CRAFT_BLUEPRINTS_COMMIT }}-
      - name: Set up Craft
        if: steps.craft-cache.outputs.cache-matched-key == ''
        run: |
          curl -fsSL "https://raw.githubusercontent.com/KDE/craft/$CRAFT_COMMIT/setup/CraftBootstrap.py" -o "$RUNNER_TEMP/CraftBootstrap.py"
          # KDE's binary cache holds RelWithDebInfo builds (as for Windows).
          python3 - "$RUNNER_TEMP/CraftBootstrap.py" <<'PY'
          import sys
          path = sys.argv[1]
          text = open(path).read()
          patched = text.replace('    boot.writeSettings()', '    boot.setSettingsValue("Compile", "BuildType", "RelWithDebInfo"); boot.writeSettings()')
          if patched == text:
              raise SystemExit("CraftBootstrap.py changed: boot.writeSettings() not found")
          open(path, "w").write(patched)
          PY
          python3 "$RUNNER_TEMP/CraftBootstrap.py" --prefix "$CRAFT_ROOT" --use-defaults
      - name: Pin Craft and its blueprints
        run: |
          set -eu
          pin() {
            dir=$1; commit=$2
            git -C "$dir" cat-file -e "$commit^{commit}" 2>/dev/null || git -C "$dir" fetch --quiet origin "$commit"
            git -C "$dir" checkout --quiet --detach "$commit"
            echo "$dir at $(git -C "$dir" rev-parse HEAD)"
          }
          pin "$CRAFT_ROOT/craft" "$CRAFT_COMMIT"
          pin "$CRAFT_ROOT/etc/blueprints/locations/craft-blueprints-kde" "$CRAFT_BLUEPRINTS_COMMIT"
      - name: Point Craft at KassenSturz's blueprint
        run: |
          set -eu
          ini="$CRAFT_ROOT/etc/CraftSettings.ini"
          python3 - "$ini" "$GITHUB_WORKSPACE/packaging/macos/craft" <<'PY'
          import re, sys
          ini, blueprints = sys.argv[1:3]
          text = open(ini).read()
          text = re.sub(r'(?m)^#?Locations = .*$', 'Locations = ' + blueprints, text)
          text = re.sub(r'(?m)^EnableDailyUpdates = .*$', 'EnableDailyUpdates = False', text)
          open(ini, "w").write(text)
          PY
          grep -E '^(ABI|Locations|UseCache|BuildType|EnableDailyUpdates) =' "$ini" || true
      - name: Install Qt and KDE Frameworks
        run: python3 "$CRAFT_ROOT/craft/bin/craft.py" --ci-mode --install-deps kassensturz
      - name: Save Craft
        # Only main saves, as for Windows (D-613).
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.craft-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /Users/runner/CraftRoot
            !/Users/runner/CraftRoot/build
            !/Users/runner/CraftRoot/download
            !/Users/runner/CraftRoot/tmp
          key: craft-macos-v1-${{ env.CRAFT_COMMIT }}-${{ env.CRAFT_BLUEPRINTS_COMMIT }}-${{ hashFiles('packaging/macos/craft/**/*.py') }}
      - name: Name the build
        id: version
        run: |
          version=$(tools/build-version.sh)
          echo "$version" > build-version
          git rev-parse --short=7 HEAD > build-commit
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version ($(cat build-commit))"
      - name: Build KassenSturz
        run: python3 "$CRAFT_ROOT/craft/bin/craft.py" --ci-mode --src-dir "$GITHUB_WORKSPACE" kassensturz
      - name: Make the app and the disk image
        run: sh packaging/macos/make-dmg.sh "$CRAFT_ROOT" "${{ steps.version.outputs.version }}" "$GITHUB_WORKSPACE/out"
      # The only check there is: start the program from the disk image as a
      # person does, without a screen. Without a book it opens the welcome
      # screen; a QML error or a missing library ends it at once (main.rs).
      - name: Start the app from the disk image
        run: |
          set -eu
          dmg=$(ls out/*.dmg)
          mnt="$RUNNER_TEMP/ks-dmg"
          mkdir -p "$mnt"
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -readonly
          trap 'hdiutil detach "$mnt" -force || true' EXIT
          ls "$mnt"
          # A copy, as dragging it to Applications is: the disk image is read-only.
          rm -rf "$RUNNER_TEMP/ks-app"; mkdir -p "$RUNNER_TEMP/ks-app"
          cp -R "$mnt/KassenSturz.app" "$RUNNER_TEMP/ks-app/"
          export QT_QPA_PLATFORM=offscreen
          export HOME="$RUNNER_TEMP/ks-home"; mkdir -p "$HOME"
          "$RUNNER_TEMP/ks-app/KassenSturz.app/Contents/MacOS/kassensturz" > "$RUNNER_TEMP/ks-out.txt" 2> "$RUNNER_TEMP/ks-err.txt" &
          pid=$!
          sleep 30
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"; wait "$pid" 2>/dev/null || true
            echo "The app was still running after 30 seconds."
            head -n 60 "$RUNNER_TEMP/ks-err.txt"
          else
            wait "$pid" || code=$?
            echo "The app ended with code ${code:-0}"
            echo "--- stderr"; head -n 80 "$RUNNER_TEMP/ks-err.txt"
            exit 1
          fi
      - name: The German catalog is in the app
        run: |
          set -eu
          mo=$(find out/KassenSturz.app -name kassensturz.mo | grep '/de/' | head -n 1)
          [ -n "$mo" ] || { echo "No German catalog in the app"; exit 1; }
          grep -q Haushaltsbuch "$mo" || { echo "$mo holds no German text"; exit 1; }
          echo "German catalog: $mo"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kassensturz-macos-${{ steps.version.outputs.version }}
          path: out/*.dmg
          if-no-files-found: error
      - name: Hand the disk image to the release
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg-for-release
          path: out/*.dmg
          if-no-files-found: error
      - name: Craft's logs
        if: failure()
        run: |
          for log in $(ls -t "$CRAFT_ROOT"/logs/* 2>/dev/null | head -n 3); do
            echo "=== $log"
            tail -n 60 "$log" | cut -c1-300
          done
