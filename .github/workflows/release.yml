name: Release

# Builds the Flatpak bundle that testers download and puts it on a pre-release
# of the public repository (D-551, D-579, D-585). It runs when the
# maintainer pushes a tag `v<build number>`, e.g. `v0.261103.0`; docs/RELEASING.md
# has the steps. Tagging and publishing stay with the maintainer (AGENTS.md 3.2):
# the workflow never creates a tag, and the tag he pushes is his decision to
# publish (D-585: no draft step; a release he does not want is deleted).
on:
  push:
    tags: ["v0.*"]
  # A pull request that changes this workflow (or the script that numbers the
  # build) runs the bundle build and install check, so the workflow is proven
  # before the first tag is pushed. The Windows and snap jobs run only for a
  # tag: their own workflows already run on pull requests that touch their
  # files, and running them here too built everything twice.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "tools/build-version.sh"

permissions:
  contents: read

# One release run per tag, and none is cancelled half-way. A pull request's
# older run is dropped when a newer commit arrives, as in ci.yml (D-220).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds the bundle in the KDE image that CI uses (D-063), numbered as D-152
  # and D-226 say.
  build:
    name: Build the Flatpak bundle
    runs-on: ubuntu-latest
    # The FinTS product registration number (D-745) is a secret of the
    # environment `release`, which only this job names and only for a tag.
    # The environment's own rules (tags `v0.*` only, the maintainer as
    # required reviewer) and the tag ruleset are set in the repository's
    # settings, outside this file, because a tag runs whatever release.yml
    # its commit holds (docs/RELEASING.md, threat T-63). A pull request's run
    # gets no environment and no secret.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
    outputs:
      version: ${{ steps.version.outputs.version }}
      file: ${{ steps.version.outputs.file }}
    steps:
      # The whole history, since the build's number counts merges (D-226).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The tag must be the number of the commit it points to, and the commit
      # must be on main, so a release always holds merged, checked code and
      # its name tells the tester which build it is. The Flatpak's copy of the
      # sources has no .git, so the number and the commit go in files that
      # build.rs reads (as in ci.yml).
      - name: Number the build and check the tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sh tools/build-version.sh)
          if [ -z "$version" ]; then
            echo "::error::tools/build-version.sh printed no number: the checkout has no history."
            exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then
            if [ "$TAG" != "v$version" ]; then
              echo "::error::The tag is $TAG, but this commit is build $version. Delete the tag and push v$version (docs/RELEASING.md)."
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::This commit is not on main. Only merged code is released."
              exit 1
            fi
          fi
          echo "$version" > build-version
          echo "$COMMIT" | cut -c1-7 > build-commit
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=KassenSturz-$version-x86_64.flatpak" >> "$GITHUB_OUTPUT"
          echo "Build $version from $(cat build-commit)"
      # SLOT (M7a.8): regenerate the example books with the build month, so
      # "this month" and "last month" are never empty in a tester's copy, before
      # the bundle is built from the sources. The generator takes a reference
      # month:
      #   - name: Example books for the build month
      #     run: <the generator in tools/> <reference month, e.g. $(date -u +%Y-%m)>
      #
      # Restore only: the cache is saved by the runs on main (ci.yml, the
      # Flatpak job), which uses this very key. A tag's run reads main's
      # caches. The step's name shows what was restored.
      - name: Restore the builder's cache
        id: builder-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flatpak-builder
          key: flatpak-builder-state-x86_64-${{ hashFiles('packaging/flatpak/**') }}
          restore-keys: flatpak-builder-state-x86_64-
      - name: "Builder cache restored from: ${{ steps.builder-cache.outputs.cache-matched-key || 'nothing' }}"
        run: ls .flatpak-builder 2>/dev/null | head || true
      # Only an official build for a tag offers "Connect to my bank" in the
      # setup wizard (D-546, Q-562); a pull request's run of this workflow
      # builds without it, as CI's own builds do. The file is read by
      # CMakeLists.txt; it holds nothing secret.
      - name: Switch on the wizard's bank offer for a tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo on > wizard-bank
          fi
      # The number goes into the git-ignored file that
      # crates/kassensturz-bank/build.rs reads, right before the build, and
      # the file is deleted right after it (the step after the build). For a
      # tag it is the secret; a tag without the secret (the environment isn't
      # set up yet, docs/RELEASING.md) builds a release without a number, as
      # every release before D-745 was, and says so in a warning. A pull
      # request's run builds with a made-up number of the right shape, so the
      # search below proves on every change where a built-in number ends up.
      # Never add `set -x` here, and never build with `cargo -vv` in this job:
      # both would show the number.
      - name: Give the build its registration number
        env:
          REF_TYPE: ${{ github.ref_type }}
          FINTS_REGISTRATION: ${{ secrets.FINTS_REGISTRATION }}
        run: |
          set -eu
          if [ "$REF_TYPE" = tag ]; then
            if [ -z "$FINTS_REGISTRATION" ]; then
              echo "::warning::The environment 'release' has no secret FINTS_REGISTRATION, so this release cannot connect to a real bank (docs/RELEASING.md, 'Once: the registration number')."
            else
              printf '%s\n' "$FINTS_REGISTRATION" > fints-registration
            fi
          else
            printf '%s\n' 0123456789ABCDEFGHIJKLMNO > fints-registration
          fi
      - name: Build the Flatpak
        run: sh tools/ci-flatpak-build.sh "${{ steps.version.outputs.file }}"
      # The number may be in the program itself and nowhere else in what was
      # built: not in the debug files, not in copied sources, not in the
      # manifest or any other file of the app. This prints file names only.
      - name: Delete the number's file and check where the number ended up
        if: always()
        run: |
          set -eu
          [ -f fints-registration ] || exit 0
          number=$(cat fints-registration)
          rm -f fints-registration
          [ -d flatpak_app ] || exit 0
          found=$(grep -rlF -- "$number" flatpak_app || true)
          echo "Files of the app that hold the number:"
          echo "${found:-none}"
          if [ -z "$found" ]; then
            echo "::error::The built app does not hold the number: bank access would not work in this build."
            exit 1
          fi
          stray=$(echo "$found" | grep -vx 'flatpak_app/files/bin/kassensturz' || true)
          if [ -n "$stray" ]; then
            echo "::error::The number is in files other than the program itself (listed above)."
            exit 1
          fi
      # Every file for the release goes up as an artifact named release-asset-*,
      # and the release job attaches all of them; the Windows job below uploads
      # its zip and installer the same way.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-flatpak
          path: ${{ steps.version.outputs.file }}
          if-no-files-found: error

  # What a tester does on Ubuntu (docs/testing/INSTALL_UBUNTU.de.md, way B,
  # steps B2 to B5 and "remove"), on a fresh runner with nothing of KassenSturz's
  # on it and no KDE runtime: install Flatpak, add the catalog and the runtime
  # for the user, install the downloaded file, start the app. A release is made
  # only if all of it worked. The commands are the sheet's; the extra flags
  # (-y, a virtual display, software drawing) are only because nobody sits at
  # this machine.
  install-check:
    name: Install the bundle as the Ubuntu sheet says
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: The downloaded file (sheet step 1) lands in Downloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-asset-flatpak
          path: ${{ github.workspace }}/Downloads
      - name: Flatpak itself (sheet step 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb
          flatpak --version
      - name: The catalog and the KDE runtime, for this user only (sheet step 3)
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.kde.Platform//6.11
      - name: Install the bundle (sheet step 4)
        working-directory: Downloads
        run: |
          ls -l
          flatpak install --user -y KassenSturz-*.flatpak
          flatpak list --user --app
      # The app opens a window and keeps running; timeout ends it with status
      # 124. A missing runtime part or a crash at start-up ends it sooner. The
      # developer mode (sheet step 5) writes the log, whose first lines show
      # that the app got as far as its first screen.
      - name: Start the app (sheet step 5)
        run: |
          set -u
          status=0
          xvfb-run -a timeout 20 flatpak run --env=KASSENSTURZ_DEBUG_LOG=1 \
            --env=QT_QUICK_BACKEND=software io.github.vondor.KassenSturz \
            > start.log 2>&1 || status=$?
          echo "--- what the app printed (tail) ---"
          tail -n 30 start.log
          echo "--- the debug log's folder ---"
          log="$HOME/.var/app/io.github.vondor.KassenSturz/data/io.github.vondor.KassenSturz/debug-log"
          ls -l "$log" || true
          test "$status" -eq 124
          test -n "$(find "$log" -type f -size +0 -print -quit)"
      # Not checked here: the sheet's update over an older build (card 6). The
      # same file can't be installed over itself ("already installed"), and a
      # second build isn't at hand; round 1 tries it with two real pre-releases.
      - name: Remove it again (sheet, "remove")
        run: |
          flatpak uninstall --user -y io.github.vondor.KassenSturz
          if flatpak list --user --app | grep -q io.github.vondor.KassenSturz; then
            echo "::error::The app is still installed after uninstall."
            exit 1
          fi

  # The Windows app (M7a.7, D-554): the same workflow that builds Windows on
  # every pull request (D-613 reversed, #509), here asked to hand its portable zip and installer to the
  # release job. It numbers the build with tools/build-version.sh, as the job
  # above does, so both files carry the tag's number. Its own run installs and
  # removes the installer and starts the app from the zip; the install sheet
  # is proven by hand on a Windows 11 virtual machine (D-542).
  windows:
    name: Windows app
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/windows-app.yml
    with:
      release: true

  # The experimental, unsigned macOS download (D-875). It starts at once, next
  # to the others, but nothing waits for it: the release below does not need
  # it, and the job after the release attaches its .dmg only if it succeeded.
  macos:
    name: macOS app (experimental)
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/macos-app.yml
    with:
      release: true

  # The snap (#892, D-765): built and installed on a fresh runner by snap.yml.
  snap:
    name: Snap
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/snap.yml
    with:
      release: ${{ github.ref_type == 'tag' }}
    secrets: inherit

  # Only for a tag. A published pre-release at once (D-585): the maintainer's
  # tag is the whole gate.
  release:
    name: Pre-release on GitHub
    needs: [build, install-check, windows, snap]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-asset-*
          merge-multiple: true
          path: assets
      - name: Make the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          ls -l assets
          previous=$(git describe --tags --abbrev=0 --match 'v0.*' "$TAG^" 2>/dev/null || true)
          {
            echo "Test build $VERSION of KassenSturz for testers. It is a pre-release and may have bugs: use made-up numbers or an example book only, never your own data."
            echo
            echo "How to install it: follow the install sheet for your system in [docs/testing](https://github.com/$GH_REPO/tree/$TAG/docs/testing)."
            echo
            echo "Windows: the signed version is in the [Microsoft Store](https://apps.microsoft.com/detail/9NM5V48PPRLQ). The installer and the zip here are not signed, so Windows shows a SmartScreen warning first. See [the code signing policy](https://github.com/$GH_REPO/blob/$TAG/docs/CODE_SIGNING_POLICY.md)."
            echo
            echo "macOS (experimental, untested): a \`.dmg\` for Macs with an Apple chip is added to this release a little later, if its build worked. It is not signed or notarized by Apple, so macOS blocks it first. Nobody on the team has a Mac to test it on. Read [docs/MACOS.md](https://github.com/$GH_REPO/blob/$TAG/docs/MACOS.md) before you open it."
            echo
            echo "Commit: \`${SHA}\`"
            if [ -n "$previous" ]; then
              echo
              echo "Changes since $previous:"
              echo
              git log --first-parent --format='- %s' "$previous..$TAG"
            fi
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run of this workflow: replace the files, keep the text.
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* \
              --title "KassenSturz $VERSION (pre-release)" \
              --notes-file notes.md \
              --prerelease --verify-tag
          fi
          echo "Pre-release for $TAG is published: https://github.com/$GH_REPO/releases/tag/$TAG" | tee -a "$GITHUB_STEP_SUMMARY"

  # Adds the experimental macOS .dmg to the release once both exist. A failed
  # or slow Mac build changes nothing about the release (D-875).
  macos-attach:
    name: Attach the experimental macOS download
    needs: [release, macos]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.release.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmg-for-release
          path: assets
      - name: Attach the disk image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          ls -l assets
          gh release upload "$TAG" assets/*.dmg --clobber

  # Puts the snap in the Snap Store (D-940, replaces D-939). The channel is
  # chosen in the release run, not by the tag: there are two jobs, each in
  # its own environment with the maintainer as required reviewer. He
  # approves the one he wants (Actions, the run, Review deployments) and
  # rejects the other, which then shows as failed without touching the
  # GitHub release, which is already out:
  #   - snap-beta: environment `snap-beta`, uploads to `beta`;
  #   - snap-stable: environment `snap-stable`, uploads to `stable` and
  #     `beta` (the stable 0.x release, D-879), so beta testers get it too.
  # Main builds go nowhere (D-845: no `edge`). Each environment holds its
  # own store login as the secret SNAPCRAFT_STORE_CREDENTIALS, so only a
  # `v0.*` tag run can read it; without it the job does nothing, with a
  # warning (docs/SNAP.md, section 8; docs/RELEASING.md).
  snap-beta:
    name: Snap Store, beta channel
    needs: [release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: snap-beta
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-asset-snap
          path: snap
      - name: Upload to the beta channel
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          CHANNELS: beta
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::warning::The environment '$GITHUB_JOB' has no secret SNAPCRAFT_STORE_CREDENTIALS, so nothing was uploaded to the Snap Store (docs/SNAP.md, section 8)."
            exit 0
          fi
          sudo snap install snapcraft --classic
          snapcraft upload --release="$CHANNELS" snap/kassensturz.snap
          echo "The snap of $TAG is in the Snap Store's channels: $CHANNELS" >> "$GITHUB_STEP_SUMMARY"

  snap-stable:
    name: Snap Store, stable and beta channels
    needs: [release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: snap-stable
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-asset-snap
          path: snap
      - name: Upload to the stable and beta channels
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          CHANNELS: stable,beta
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::warning::The environment '$GITHUB_JOB' has no secret SNAPCRAFT_STORE_CREDENTIALS, so nothing was uploaded to the Snap Store (docs/SNAP.md, section 8)."
            exit 0
          fi
          sudo snap install snapcraft --classic
          snapcraft upload --release="$CHANNELS" snap/kassensturz.snap
          echo "The snap of $TAG is in the Snap Store's channels: $CHANNELS" >> "$GITHUB_STEP_SUMMARY"
      # The store page follows snapcraft.yaml (D-947): summary, title,
      # description, license and icon of this snap replace what was edited on
      # the web. Category, links and screenshots stay as they are there. A
      # failure here only warns: the snap is already released.
      - name: Update the store page from snapcraft.yaml
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -u
          [ -n "$SNAPCRAFT_STORE_CREDENTIALS" ] || exit 0
          if snapcraft upload-metadata --force snap/kassensturz.snap; then
            echo "The Snap Store page now shows the texts and icon of this release's snapcraft.yaml." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The Snap Store page was not updated. The most likely cause is a store login without the package_metadata permission (docs/RELEASING.md, \"Updating the Snap Store page\"). The snap itself is released."
          fi

  # Puts the Windows package (the `...-store.msix` of the release) into the
  # Microsoft Store (#927, D-844), so the maintainer no longer uploads it in
  # Partner Center by hand. The tag he pushed is his decision to publish
  # (AGENTS.md 3.2), and the job runs in the environment `release`, so it
  # waits for his approval and only a `v0.*` tag run can read the Store
  # login. It is off until he sets the repository variable STORE_UPLOAD
  # (docs/WINDOWS.md, section 2):
  #   - `draft`: the package goes up as a draft submission; he presses
  #     "Submit" in Partner Center (the maintainer's choice, Q-631);
  #   - `submit`: the submission goes to Microsoft's certification at once;
  #     with the variable STORE_FLIGHT_ID it goes to that package flight only.
  # Its result does not change the GitHub release, which is already published.
  # A pull request that changes this file runs only the CLI's download and
  # check, with no environment and no secret.
  store-upload:
    name: Upload the Windows package to the Microsoft Store
    needs: [release]
    if: >-
      !cancelled() && (github.event_name == 'pull_request' ||
      (github.ref_type == 'tag' && needs.release.result == 'success' &&
      (vars.STORE_UPLOAD == 'draft' || vars.STORE_UPLOAD == 'submit')))
    runs-on: windows-2022
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    env:
      # Microsoft Store Developer CLI (MIT, docs/THIRD_PARTY.md), the release
      # file pinned by its SHA-256.
      MSSTORE_CLI_URL: https://github.com/microsoft/msstore-cli/releases/download/v0.4.4/MSStoreCLI-win-x64.zip
      MSSTORE_CLI_SHA256: d288a324541dc68244a683eb5b6445e9239bb47d1e6acf5cca4d1476017f1447
      # The app's Store ID from Partner Center; public, like the identity in
      # packaging/windows/msix/AppxManifest.xml.
      STORE_APP_ID: 9NM5V48PPRLQ
    steps:
      # The CLI sends usage data to Microsoft unless its settings file says
      # otherwise, and it reads that file before its first command. So the
      # file is written first; the check after the upload shows it still says
      # off. Settings folder and field name from the CLI's source (v0.4.4).
      - name: Get the Store CLI, with its usage data switched off
        run: |
          $ErrorActionPreference = 'Stop'
          $settings = Join-Path $env:LOCALAPPDATA 'Microsoft\MSStore.CLI'
          New-Item -ItemType Directory -Force -Path $settings | Out-Null
          Set-Content -Path (Join-Path $settings 'telemetrySettings.json') -Value '{"TelemetryEnabled":false}' -Encoding utf8NoBOM
          $zip = Join-Path $env:RUNNER_TEMP 'msstore.zip'
          Invoke-WebRequest -Uri $env:MSSTORE_CLI_URL -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:MSSTORE_CLI_SHA256) { throw "The Store CLI download has SHA-256 $hash, expected $env:MSSTORE_CLI_SHA256" }
          $dir = Join-Path $env:RUNNER_TEMP 'msstore'
          Expand-Archive -Path $zip -DestinationPath $dir
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: The CLI starts
        run: |
          msstore --version
          if ($LASTEXITCODE -ne 0) { throw "msstore --version failed ($LASTEXITCODE)" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.ref_type == 'tag'
        with:
          name: release-asset-windows
          path: windows
      # The secrets reach the CLI only as arguments, which GitHub masks in the
      # log; never print them, and never add `Set-PSDebug -Trace` here.
      # `msstore publish` makes a new submission from the last published one
      # and replaces its package; the first submission was made by hand,
      # which the CLI requires for a loose MSIX.
      - name: Upload to Partner Center
        if: github.ref_type == 'tag'
        env:
          MODE: ${{ vars.STORE_UPLOAD }}
          FLIGHT: ${{ vars.STORE_FLIGHT_ID }}
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'STORE_TENANT_ID', 'STORE_SELLER_ID', 'STORE_CLIENT_ID', 'STORE_CLIENT_SECRET') {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "The environment 'release' has no secret $name (docs/WINDOWS.md, section 2)."
            }
          }
          $msix = @(Get-ChildItem windows -Filter '*-windows-x64-store.msix')
          if ($msix.Count -ne 1) { throw "Expected one ...-windows-x64-store.msix in the release files, found $($msix.Count)" }
          msstore reconfigure --tenantId $env:STORE_TENANT_ID --sellerId $env:STORE_SELLER_ID --clientId $env:STORE_CLIENT_ID --clientSecret $env:STORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed ($LASTEXITCODE): check the four secrets and the client secret's expiry date (docs/WINDOWS.md)." }
          $publish = @('publish', $msix[0].FullName, '--appId', $env:STORE_APP_ID)
          if ($env:MODE -ne 'submit') { $publish += '--noCommit' }
          if ($env:FLIGHT) { $publish += @('--flightId', $env:FLIGHT) }
          Write-Output "Uploading $($msix[0].Name) ($env:MODE$(if ($env:FLIGHT) { ', flight ' + $env:FLIGHT }))"
          msstore @publish
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed ($LASTEXITCODE)" }
          if ($env:MODE -eq 'submit') {
            "The package $($msix[0].Name) was submitted to the Microsoft Store's certification." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "The package $($msix[0].Name) is a draft submission in Partner Center: open the app there and press Submit." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: The CLI's usage data stayed off
        if: always()
        run: |
          $file = Join-Path $env:LOCALAPPDATA 'Microsoft\MSStore.CLI\telemetrySettings.json'
          $text = Get-Content -Raw $file
          if (($text | ConvertFrom-Json).TelemetryEnabled -ne $false) { throw "The Store CLI switched its usage data on: $file" }
