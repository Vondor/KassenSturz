name: Wiki

# Copies the user handbook (docs/user/de and docs/user/en) into the GitHub
# Wiki after a merge to main (D-880). The handbook itself stays in the
# repository, reviewed in pull requests (#654); the Wiki is only a copy, and
# every Wiki page says so and points to the file to change instead.
# tools/wiki-sync.py makes the pages. In a pull request this workflow only
# builds them, so a broken link fails there; nothing is pushed.

on:
  push:
    branches: [main]
    paths:
      - "docs/user/de/**"
      - "docs/user/en/**"
      - "tools/wiki-sync.py"
      - ".github/workflows/wiki.yml"
  pull_request:
    paths:
      - "docs/user/de/**"
      - "docs/user/en/**"
      - "tools/wiki-sync.py"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Build the Wiki pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the pages
        run: python3 -I tools/wiki-sync.py "$RUNNER_TEMP/wiki-pages" --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wiki-pages
          path: ${{ runner.temp }}/wiki-pages
          retention-days: 7

  publish:
    name: Copy the pages into the Wiki
    needs: pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job may write, and only to the Wiki: the Wiki's git
    # repository counts as the repository's contents for GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wiki-pages
          path: ${{ runner.temp }}/wiki-pages
      - name: Push the pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wiki="$RUNNER_TEMP/wiki"
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          # The Wiki's git repository exists only after its first page was
          # saved in the browser; say so plainly instead of a git error.
          if ! git clone --quiet --depth 1 "$url" "$wiki" 2>/dev/null; then
            echo "::error::The Wiki has no git repository yet. Open the Wiki tab on GitHub, save any first page once, then run this workflow again (Actions, Wiki, Run workflow)."
            exit 1
          fi
          # The Wiki is a copy: pages that are no longer in docs/user go.
          find "$wiki" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP"/wiki-pages/*.md "$wiki"/
          cd "$wiki"
          git add --all
          if git diff --cached --quiet; then
            echo "The Wiki already matches docs/user."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Copy the handbook from ${GITHUB_SHA::12}"
          git push --quiet origin HEAD
          echo "Pushed $(git ls-files | wc -l) pages to the Wiki."
