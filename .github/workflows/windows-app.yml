name: Windows app

# The Qt app for Windows (M7a.7, D-554). KDE Craft brings Qt 6 and KDE
# Frameworks from its binary cache for Visual Studio 2022, builds KassenSturz
# with the project's CMake (which drives Cargo, D-063) and packs it as a
# portable zip and an installer, both unsigned until signing comes (D-048).
# This file is separate from ci.yml on purpose: the run is long (20 to 30
# minutes warm).
#
# It runs on every push to main that touches more than documentation, so a
# Windows-only break shows within one merge, and for a pre-release tag through
# release.yml, so no release ships without it. A pull request builds it only
# when it touches Windows-relevant files (D-874, see the `changes` job) or
# carries the `windows` label; every other pull request still gets the quick
# Windows lints and tests of ci.yml. Craft's cache is still saved only from main.

on:
  # Every pull request starts this workflow, so its build can be a required
  # check: a workflow-level `paths:` filter would leave a required check
  # pending for ever on a pull request it doesn't match (D-791). The
  # `changes` job below decides instead, and a build skipped by its job-level
  # `if` counts as passed. Documentation, the other workflows and the snap
  # packaging skip the build; its own workflow file and the Windows packaging
  # build it.
  pull_request:
    # `labeled` lets the `windows` label start the build on an open pull
    # request (D-874); a run for any other label only skips (see concurrency).
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!LICENSES/**"
      - "!*.md"
      - "!REUSE.toml"
      - "!CODEOWNERS"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.github/PULL_REQUEST_TEMPLATE.md"
      - "!.github/FUNDING.yml"
      - "!.github/workflows/**"
      - "!packaging/snap/**"
      - "docs/ERROR_CODES.md"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:
  # release.yml calls this workflow for a pre-release tag and attaches what
  # it uploads as release-asset-windows (D-551, D-554).
  workflow_call:
    inputs:
      release:
        description: Upload the packages as release-asset-windows for the release job
        type: boolean
        default: false

permissions:
  contents: read

# In a call from release.yml, github.workflow is the caller's name, so a pull
# request's own Windows run and the release workflow's call of it don't
# cancel each other. A newer push to a pull request ends the older run; main's
# runs are never cancelled, since they fill the caches.
concurrency:
  group: windows-app-${{ github.workflow }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'windows' && github.run_id) || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CRAFT_ROOT: C:\CraftRoot
  # Craft and its blueprints, pinned, so a run builds the same thing
  # until these are moved on purpose (with the cache key below). Craft's
  # binary cache (CacheVersion 26.10) has the package versions these
  # blueprints ask for. The bootstrap script comes from the same Craft
  # commit; the bootstrap fetches Craft's current code, which the "Pin
  # Craft" step then checks out at these commits.
  CRAFT_COMMIT: 911cb3f55b2ce0cb95c6a0013678028190a34a66
  CRAFT_BLUEPRINTS_COMMIT: 0cb3f8cd34e5ce8527c278537825fb2315704496
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Windows build needed?
    # A label other than `windows` starts this workflow too, because the
    # trigger can't name one label. Such a run has nothing to decide, so it
    # is skipped here, before it takes a runner (D-957): on 20 November this
    # job started 230 times for 60 pull request runs. The build job below
    # needs this one and is skipped with it.
    if: github.event.action != 'labeled' || github.event.label.name == 'windows'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Decide from the changed files
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          set -euo pipefail
          # Only a pull request can skip the build; a push to main (already
          # filtered above), a manual run and release.yml's call always build.
          if [ "$EVENT" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Adding some other label starts this workflow too; it builds nothing.
          if [ "$ACTION" = "labeled" ] && [ "$LABEL" != "windows" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The `windows` label forces the build on a pull request (D-874).
          if grep -qw windows <<< "$LABELS"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Windows build needed: true (label windows)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          # Files that decide what the Windows app is made of: packaging, the
          # CMake and Craft setup, dependencies (manifests and lock file), the
          # platform crate (keychain, paths), the AqBanking binding, the C++
          # side of the app and its build script, and this workflow (D-874).
          always='^(packaging/windows/|CMakeLists\.txt$|cmake/|Cargo\.(toml|lock)$|crates/[^/]+/Cargo\.toml$|crates/kassensturz-platform/|crates/kassensturz-aqbanking-sys/|crates/kassensturz-ui-bridge/(cpp/|build\.rs$)|\.github/workflows/windows-app\.yml$|docs/ERROR_CODES\.md$)'
          by_path=$(grep -E "$always" <<< "$changed" || true)
          # Any other changed file that still exists and names Windows (a
          # cfg(windows) block, a Windows path, Q_OS_WIN, ...) counts too.
          by_content=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in docs/*|LICENSES/*|*.md|.github/*|packaging/snap/*) continue ;; esac
            git cat-file -e "$HEAD:$f" 2>/dev/null || continue
            if git show "$HEAD:$f" | grep -qaiE 'windows|win32|Q_OS_WIN|target_os|appdata|msix|\.exe\b'; then
              by_content="$by_content$f"$'\n'
            fi
          done <<< "$changed"
          if [ -n "$by_path$by_content" ]; then build=true; else build=false; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Windows build needed: $build" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' $by_path $by_content | head -20

  windows-app:
    name: Windows app with KDE Craft (D-554)
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    # Craft's binary cache is built for Visual Studio 2022; windows-latest has
    # only Visual Studio 2026, which Craft's cache doesn't cover (D-214).
    runs-on: windows-2022
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tools/build-version.sh counts the day's commits (D-226).
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      # Craft's own folder with Qt and KDE Frameworks, kept between runs so
      # only the first run downloads them. Craft's downloads and build folders
      # are left out: they are big and rebuilt anyway.
      - name: Restore Craft
        id: craft-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:\CraftRoot
            !C:\CraftRoot\build
            !C:\CraftRoot\download
            !C:\CraftRoot\tmp
          key: craft-msvc2022-v2-${{ env.CRAFT_COMMIT }}-${{ env.CRAFT_BLUEPRINTS_COMMIT }}-${{ hashFiles('packaging/windows/craft/**/*.py') }}
          restore-keys: craft-msvc2022-v2-${{ env.CRAFT_COMMIT }}-${{ env.CRAFT_BLUEPRINTS_COMMIT }}-
      - name: Set up Craft
        if: steps.craft-cache.outputs.cache-matched-key == ''
        run: |
          $boot = "$env:RUNNER_TEMP\CraftBootstrap.py"
          Invoke-WebRequest "https://raw.githubusercontent.com/KDE/craft/$env:CRAFT_COMMIT/setup/CraftBootstrap.py" -OutFile $boot
          # Craft's settings default to MinSizeRel now, but KDE's binary
          # cache holds RelWithDebInfo builds: with MinSizeRel the bootstrap
          # finds nothing and builds Perl, ICU, gettext and Python from
          # source (run 1 took 52 minutes and failed in gettext). The
          # bootstrap starts Craft right after writing the settings, so the
          # build type goes in before that.
          $text = Get-Content $boot -Raw
          $patched = $text.Replace('    boot.writeSettings()', '    boot.setSettingsValue("Compile", "BuildType", "RelWithDebInfo"); boot.writeSettings()')
          if ($patched -eq $text) { throw "CraftBootstrap.py changed: boot.writeSettings() not found" }
          Set-Content $boot $patched
          python $boot --prefix $env:CRAFT_ROOT --use-defaults
      - name: Pin Craft and its blueprints
        run: |
          $pins = @(
            @("$env:CRAFT_ROOT\craft", $env:CRAFT_COMMIT),
            @("$env:CRAFT_ROOT\etc\blueprints\locations\craft-blueprints-kde", $env:CRAFT_BLUEPRINTS_COMMIT)
          )
          foreach ($pin in $pins) {
            $dir, $commit = $pin
            git -C $dir cat-file -e "$commit^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) { git -C $dir fetch --quiet origin $commit; if ($LASTEXITCODE -ne 0) { throw "can't fetch $commit into $dir" } }
            git -C $dir checkout --quiet --detach $commit
            if ($LASTEXITCODE -ne 0) { throw "can't check out $commit in $dir" }
            Write-Output "$dir at $(git -C $dir rev-parse HEAD)"
          }
      - name: Point Craft at KassenSturz's blueprint
        run: |
          $ini = "$env:CRAFT_ROOT\etc\CraftSettings.ini"
          $blueprints = "$env:GITHUB_WORKSPACE\packaging\windows\craft"
          $text = Get-Content $ini -Raw
          $text = $text -replace '(?m)^#?Locations = .*$', "Locations = $blueprints"
          # No daily blueprint updates: the pinned commits stay as they are.
          $text = $text -replace '(?m)^EnableDailyUpdates = .*$', 'EnableDailyUpdates = False'
          Set-Content $ini $text
          Select-String -Path $ini -Pattern '^(ABI|Locations|UseCache|BuildType|EnableDailyUpdates) ='
      - name: Install Qt and KDE Frameworks
        run: python "$env:CRAFT_ROOT\craft\bin\craft.py" --ci-mode --install-deps kassensturz
      # Craft's own packages (craft/craft-core, craft/craft-blueprints-kde) are in
      # the install list of a cold run, and installing them runs `git checkout
      # master` in the very folders pinned above. The next Craft run would then
      # read blueprints newer than KDE's binary cache (on 2026-11-20 master
      # asked for ffmpeg 8.1.3, which the cache didn't have yet, and the build
      # failed in ffmpeg's configure). So the pins are set again, and the cache
      # saved below holds the pinned state.
      - name: Pin Craft and its blueprints again
        run: |
          $pins = @(
            @("$env:CRAFT_ROOT\craft", $env:CRAFT_COMMIT),
            @("$env:CRAFT_ROOT\etc\blueprints\locations\craft-blueprints-kde", $env:CRAFT_BLUEPRINTS_COMMIT)
          )
          foreach ($pin in $pins) {
            $dir, $commit = $pin
            git -C $dir cat-file -e "$commit^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) { git -C $dir fetch --quiet origin $commit; if ($LASTEXITCODE -ne 0) { throw "can't fetch $commit into $dir" } }
            git -C $dir checkout --quiet --detach $commit
            if ($LASTEXITCODE -ne 0) { throw "can't check out $commit in $dir" }
            Write-Output "$dir at $(git -C $dir rev-parse HEAD)"
          }
      - name: Save Craft
        # Only main saves (D-613, as D-427 for Cargo's caches): a pull
        # request's copy of this several-GB folder serves no other branch and
        # pushes main's caches out of GitHub's 10 GB limit. On 2026-11-06 that
        # left the Flatpak and Craft caches empty for most of the day. A
        # cold main cache is filled by starting this workflow by hand on main.
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.craft-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:\CraftRoot
            !C:\CraftRoot\build
            !C:\CraftRoot\download
            !C:\CraftRoot\tmp
          key: craft-msvc2022-v2-${{ env.CRAFT_COMMIT }}-${{ env.CRAFT_BLUEPRINTS_COMMIT }}-${{ hashFiles('packaging/windows/craft/**/*.py') }}
      - name: The Craft path patching still works on made-up bytes
        run: python tools/windows-compiled-in-paths.py self-test
      - name: Name the build
        id: version
        shell: bash
        run: |
          version=$(tools/build-version.sh)
          echo "$version" > build-version
          git rev-parse --short=7 HEAD > build-commit
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version ($(cat build-commit))"
      - name: Build KassenSturz
        run: python "$env:CRAFT_ROOT\craft\bin\craft.py" --ci-mode --src-dir "$env:GITHUB_WORKSPACE" kassensturz
      - name: Pack the portable zip
        run: python "$env:CRAFT_ROOT\craft\bin\craft.py" --ci-mode --src-dir "$env:GITHUB_WORKSPACE" --options "[Packager]PackageType=PortablePackager" --options "[Packager]7ZipArchiveType=zip" --package kassensturz
      - name: Pack the installer
        run: python "$env:CRAFT_ROOT\craft\bin\craft.py" --ci-mode --src-dir "$env:GITHUB_WORKSPACE" --options "[Packager]PackageType=NullsoftInstallerPackager" --package kassensturz
      - name: Collect the packages
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $out = New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\out"
          Get-ChildItem "$env:CRAFT_ROOT\tmp" -File | Format-Table Name, Length
          $zip = Get-ChildItem "$env:CRAFT_ROOT\tmp\kassensturz-*.zip" | Where-Object Name -NotMatch '-dbg' | Select-Object -First 1
          $exe = Get-ChildItem "$env:CRAFT_ROOT\tmp\kassensturz-*.exe" | Select-Object -First 1
          Copy-Item $zip.FullName "$out\KassenSturz-$version-windows-x64.zip"
          Copy-Item $exe.FullName "$out\KassenSturz-$version-windows-x64-setup.exe"
          Get-ChildItem $out | Format-Table Name, Length
      # Craft's build folder holds hundreds of programs nobody needs at run
      # time (ffmpeg, openssl, sqlite3, windeployqt, ...). Only the programs
      # in packaging/windows/allowed-executables.txt may be in the package
      # (B-292); a new program needs a line there, made on purpose.
      - name: Only the allowed programs are in the zip
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = (Get-ChildItem "$env:GITHUB_WORKSPACE\out\*.zip").FullName
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try { $names = $archive.Entries | ForEach-Object { $_.FullName } } finally { $archive.Dispose() }
          $found = $names | Where-Object { $_ -match '\.exe$' } | ForEach-Object {
            # The path inside the package, whatever folder the zip puts it in.
            if ($_ -match '(?i)(?:^|[\\/])(bin[\\/].*)$') { $matches[1].Replace('\', '/').ToLowerInvariant() } else { $_.Replace('\', '/').ToLowerInvariant() }
          } | Sort-Object -Unique
          $allowed = Get-Content "$env:GITHUB_WORKSPACE\packaging\windows\allowed-executables.txt" | Where-Object { $_ -and -not $_.StartsWith('#') } | ForEach-Object { $_.Trim().ToLowerInvariant() }
          Write-Output "Programs in the zip ($($found.Count)):"; $found | ForEach-Object { Write-Output "  $_" }
          $extra = $found | Where-Object { $allowed -notcontains $_ }
          if ($extra) { Write-Output "Not allowed:"; $extra | ForEach-Object { Write-Output "  $_" }; throw "The zip holds programs that are not in packaging/windows/allowed-executables.txt" }
          if ($found -notcontains 'bin/kassensturz.exe') { throw "bin/kassensturz.exe is not in the zip" }
      # The program from the zip, not from Craft's folder, so a library or QML
      # module the package lacks shows up here. Without a book it opens the
      # welcome screen; a QML error ends it at once (main.rs).
      - name: Start the app from the zip
        run: |
          $dir = "$env:RUNNER_TEMP\ks-zip"
          Expand-Archive (Get-ChildItem "$env:GITHUB_WORKSPACE\out\*.zip").FullName $dir
          $exe = Get-ChildItem $dir -Recurse -Filter kassensturz.exe | Select-Object -First 1
          Write-Output "Starting $($exe.FullName)"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:APPDATA = "$env:RUNNER_TEMP\ks-appdata"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\ks-localappdata"
          $p = Start-Process $exe.FullName -PassThru -RedirectStandardError "$env:RUNNER_TEMP\ks-err.txt" -RedirectStandardOutput "$env:RUNNER_TEMP\ks-out.txt"
          Start-Sleep -Seconds 30
          $running = -not $p.HasExited
          if ($running) { Stop-Process -Id $p.Id -Force }
          Write-Output "--- stderr"; Get-Content "$env:RUNNER_TEMP\ks-err.txt" -ErrorAction SilentlyContinue | Select-Object -First 80
          if (-not $running) { Write-Output "The app ended with code $($p.ExitCode)"; exit 1 }
          Write-Output "The app was still running after 30 seconds."
      # A logoff or shutdown must end the app like quitting does, so the book
      # is closed and its lock file removed (B-287). Windows sends the
      # window the end of the session; the app must then end by itself, with
      # status 0, and not be left for Windows to kill. This starts the app
      # with a real window (the runner has a desktop) and sends exactly what
      # Windows sends. It never passes without a window to send to.
      - name: The app ends when the Windows session ends
        run: |
          $dir = "$env:RUNNER_TEMP\ks-zip"
          $exe = Get-ChildItem $dir -Recurse -Filter kassensturz.exe | Select-Object -First 1
          $env:APPDATA = "$env:RUNNER_TEMP\ks-appdata-end"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\ks-localappdata-end"
          $env:KASSENSTURZ_TEST = "1"
          Add-Type -Namespace Ks -Name Win -MemberDefinition '[DllImport("user32.dll")] public static extern System.IntPtr SendMessageW(System.IntPtr w, uint m, System.UIntPtr wp, System.IntPtr lp);'
          $p = Start-Process $exe.FullName -PassThru -RedirectStandardError "$env:RUNNER_TEMP\ks-err-end.txt"
          $handle = [System.IntPtr]::Zero
          for ($i = 0; $i -lt 30 -and $handle -eq [System.IntPtr]::Zero -and -not $p.HasExited; $i++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            $handle = $p.MainWindowHandle
          }
          if ($p.HasExited) { Write-Output "The app ended by itself with code $($p.ExitCode)"; Get-Content "$env:RUNNER_TEMP\ks-err-end.txt" -ErrorAction SilentlyContinue | Select-Object -First 60; exit 1 }
          if ($handle -eq [System.IntPtr]::Zero) { Stop-Process -Id $p.Id -Force; throw "The app has no window to send the end of the session to" }
          Start-Sleep -Seconds 5
          # WM_QUERYENDSESSION (0x11), then WM_ENDSESSION (0x16) with the session ending.
          [void][Ks.Win]::SendMessageW($handle, 0x11, [System.UIntPtr]::Zero, [System.IntPtr]::Zero)
          [void][Ks.Win]::SendMessageW($handle, 0x16, [System.UIntPtr]1, [System.IntPtr]::Zero)
          if (-not $p.WaitForExit(20000)) { Stop-Process -Id $p.Id -Force; throw "The app did not end within 20 seconds of the end of the session" }
          Write-Output "The app ended with code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\ks-err-end.txt" -ErrorAction SilentlyContinue | Select-Object -First 60; throw "The app ended with code $($p.ExitCode), not 0" }
      # The installer as a tester runs it, but silent (/S): it must install
      # without administrator rights into the user's own folder, put an entry
      # in the Start menu, and its uninstaller must take both away again
      # (installer.nsi, D-583). The runner's account is an administrator, so
      # this checks where it installs, not that Windows doesn't ask.
      - name: Install and remove with the installer
        run: |
          $setup = (Get-ChildItem "$env:GITHUB_WORKSPACE\out\*-setup.exe").FullName
          $dir = "$env:LOCALAPPDATA\Programs\KassenSturz"
          $link = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\KassenSturz.lnk"
          $p = Start-Process $setup -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer ended with code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\bin\kassensturz.exe")) { throw "No kassensturz.exe in $dir\bin" }
          if (-not (Test-Path $link)) { throw "No Start menu entry at $link" }
          if (Test-Path "$env:ProgramFiles\KassenSturz") { throw "It installed into Program Files" }
          Write-Output "Installed into $dir with a Start menu entry."
          $p = Start-Process "$dir\uninstall.exe" -ArgumentList "/S" -Wait -PassThru
          # The uninstaller copies itself away and returns at once; give it time.
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\bin\kassensturz.exe"); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path "$dir\bin\kassensturz.exe") { throw "kassensturz.exe is still there after uninstalling" }
          if (Test-Path $link) { throw "The Start menu entry is still there after uninstalling" }
          Write-Output "Removed again."
      # The libraries come from Craft's build and have its folder (C:\Craft...)
      # compiled in as a path; any user can create that folder on another
      # computer (B-293, CWE-427). The recipe turns each such path into one
      # below the NUL device before packing (tools/windows-compiled-in-paths.py)
      # and the app points the OpenSSL and libxml2 variables at its install
      # folder at start (install_paths.rs). Nothing may be left in the zip.
      # The patching must not have touched what the app reads at run time: the
      # German catalog is in the package and holds German text. This checks the
      # file, not the loading (that needs a window to look at); the start
      # step above shows that the app starts from the same package.
      - name: The German catalog is in the package
        run: |
          $found = $null
          foreach ($mo in (Get-ChildItem "$env:RUNNER_TEMP\ks-zip" -Recurse -Filter *.mo | Where-Object { $_.FullName -match '[\\/]de[\\/]' })) {
            $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($mo.FullName))
            if ($text -match 'Haushaltsbuch') { $found = $mo; break }
          }
          if (-not $found) { throw "No German catalog with German text (.mo under a de folder) in the package" }
          $mo = $found
          Write-Output "German catalog: $($mo.FullName) ($($mo.Length) bytes)"
      - name: No Craft folder is compiled into the package
        run: python tools/windows-compiled-in-paths.py check "$env:RUNNER_TEMP\ks-zip"
      # The Microsoft Store package (#927): the same programs as the zip, in
      # an MSIX the Store signs itself, so it is built unsigned. The owner
      # uploads it in Partner Center (docs/WINDOWS.md).
      - name: Pack the Microsoft Store package
        run: >
          packaging\windows\msix\build-msix.ps1
          -Root "$env:RUNNER_TEMP\ks-zip"
          -Version "${{ steps.version.outputs.version }}"
          -Out "$env:GITHUB_WORKSPACE\out\KassenSturz-${{ steps.version.outputs.version }}-windows-x64-store.msix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kassensturz-windows-${{ steps.version.outputs.version }}
          path: out/*
          if-no-files-found: error
      # The release job attaches every artifact named release-asset-* to the
      # draft pre-release (release.yml).
      - name: Hand the packages to the release
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-windows
          path: out/*
          if-no-files-found: error
      # Craft prints very long lines; the tail of its log is what explains a
      # failure, so the last lines of each log come at the very end.
      - name: Craft's logs
        if: failure()
        run: |
          Get-ChildItem "$env:CRAFT_ROOT\logs" -Recurse -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 3 | ForEach-Object {
            Write-Output "=== $($_.Name)"
            Get-Content $_.FullName -Tail 60 | ForEach-Object { if ($_.Length -gt 300) { $_.Substring(0, 300) } else { $_ } }
          }
