[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.261023.0"
edition = "2024"
# The Rust in the KDE Flatpak SDK's Rust extension, KassenSturz's one build
# environment (D-063). Raised only deliberately, never as a side effect of a
# dependency update (D-025).
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/Vondor/KassenSturz"
publish = false

[workspace.dependencies]
kassensturz-ai = { path = "crates/kassensturz-ai", default-features = false }
kassensturz-ai-chat = { path = "crates/kassensturz-ai-chat", default-features = false }
kassensturz-ai-tools = { path = "crates/kassensturz-ai-tools", default-features = false }
kassensturz-aqbanking-sys = { path = "crates/kassensturz-aqbanking-sys" }
kassensturz-core = { path = "crates/kassensturz-core" }
kassensturz-export = { path = "crates/kassensturz-export" }
kassensturz-import = { path = "crates/kassensturz-import", default-features = false }
kassensturz-bank = { path = "crates/kassensturz-bank" }
kassensturz-pipeline = { path = "crates/kassensturz-pipeline", default-features = false }
kassensturz-platform = { path = "crates/kassensturz-platform" }
kassensturz-store = { path = "crates/kassensturz-store", default-features = false }

# Direct dependencies. Each one is approved by the maintainer and listed in
# docs/THIRD_PARTY.md before it is added here (AGENTS.md §3.1 rule 6, D-026).
# Versions are pinned exactly, so updating one is always a deliberate change.
cxx = "=1.0.205"
cxx-qt = "=0.10.0"
cxx-qt-build = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
cxx-qt-lib-extras = "=0.10.0"
# Without time-zone data: transaction dates are calendar dates (D-061).
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }
# XML for CAMT.053 (D-093), OFX 2.x (M2.6) and KMyMoney (M2.9): a pull parser
# that never expands entities or fetches anything, without its optional
# encoding and serde features.
quick-xml = { version = "=0.42.0", default-features = false }
# gzip for KMyMoney's .kmy files (M2.9): the pure-Rust backend only, so no C
# zlib is built or linked.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# Loads AqBanking and Gwenhywfar at runtime by their ABI names, so KassenSturz
# starts and works without them (D-054, D-060, D-138). Approved by the
# maintainer in M4 Phase 0.
libloading = "=0.9.0"
# The system keychain for saved banking PINs (D-057): the Secret Service on
# Linux, which KWallet and GNOME Keyring answer, and the Windows and macOS
# keychains for M7 (Q-085 answer A, D-146). Only its `v1` feature: the
# stores the API needs, nothing from its command-line sample. Approved by
# the maintainer in M4 Phase 0.
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
# KeePassXC's browser interface for saved banking PINs (D-164): base64 for
# its keys and messages. Standard alphabet only, no default features beyond
# `std`.
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
# KeePassXC's browser interface encrypts every message with NaCl's
# crypto_box (X25519, XSalsa20-Poly1305), libsodium's format (D-164).
# RustCrypto's implementation, so KassenSturz writes no cryptography of its
# own (AGENTS.md §3.1 rule 7).
crypto_box = { version = "=0.9.1", default-features = false, features = ["alloc", "std", "getrandom", "salsa20"] }
# Patterns in Rules (D-015): linear-time matching, so no pattern can hang the
# app.
regex = "=1.13.1"
rusqlite = { version = "=0.40.2", default-features = false }
# JSON for the complete export of a book (D-029, Q-049): written by
# KassenSturz's own code, so the keys keep the order docs/EXPORT_FORMAT.md
# shows, and read into serde_json's Value without any serde derive.
serde_json = "=1.0.154"
# Without serde: KassenSturz stores rates as two INTEGER columns (D-051).
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std"] }
uuid = { version = "=1.28.0", features = ["v7"] }
# The HTTP client of the AI adapter in kassensturz-ai (D-035, D-175; Q-122 A),
# the only HTTP client in KassenSturz (threat T-13). Blocking, so the core
# needs no async runtime. Without its default features, so no certificate
# list is built in: rustls checks against the system's store through
# rustls-platform-verifier, and the crypto provider is passed in.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
# The TLS library for ureq (Q-122 A), with AWS-LC as its crypto provider.
# KassenSturz writes no cryptography of its own (AGENTS.md §3.1 rule 7).
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
# The MCP server's protocol (D-050, D-175; Q-123 B), only in
# kassensturz-mcp: the official SDK, without its default features, with only
# the server and the stdio transport. Every other transport stays out, and
# tests in kassensturz-mcp fail if one comes in (threats T-13, T-32).
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
# The async runtime rmcp runs on, only in kassensturz-mcp (D-194): the
# version rmcp brings anyway, a single-threaded runtime with its timer and
# without its I/O driver, so it never polls a socket.
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time"] }
# Wipes a banking PIN from memory when it is no longer needed (D-057, threat
# T-02). Without its default features: `alloc` is enough for a wiped String.
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

# Test-only dependencies, covered by the license allowlist (D-026).
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# Hard rule 1 (AGENTS.md §3.1): no floating point for money, prices, exchange
# rates or quantities. clippy.toml blocks the libraries' floating-point methods.
float_arithmetic = "deny"
disallowed_methods = "deny"
