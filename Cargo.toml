[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The Rust in the KDE Flatpak SDK's Rust extension, KassenSturz's one build
# environment (D-063). Raised only deliberately, never as a side effect of a
# dependency update (D-025).
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/Vondor/KassenSturz"
publish = false

[workspace.dependencies]
kassensturz-aqbanking-sys = { path = "crates/kassensturz-aqbanking-sys" }
kassensturz-core = { path = "crates/kassensturz-core" }
kassensturz-export = { path = "crates/kassensturz-export" }
kassensturz-import = { path = "crates/kassensturz-import", default-features = false }
kassensturz-bank = { path = "crates/kassensturz-bank" }
kassensturz-pipeline = { path = "crates/kassensturz-pipeline", default-features = false }
kassensturz-store = { path = "crates/kassensturz-store", default-features = false }

# Direct dependencies. Each one is approved by the maintainer and listed in
# docs/THIRD_PARTY.md before it is added here (AGENTS.md §3.1 rule 6, D-026).
# Versions are pinned exactly, so updating one is always a deliberate change.
cxx = "=1.0.205"
cxx-qt = "=0.10.0"
cxx-qt-build = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
cxx-qt-lib-extras = "=0.10.0"
# Without time-zone data: transaction dates are calendar dates (D-061).
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }
# XML for CAMT.053 (D-093), OFX 2.x (M2.6) and KMyMoney (M2.9): a pull parser
# that never expands entities or fetches anything, without its optional
# encoding and serde features.
quick-xml = { version = "=0.42.0", default-features = false }
# gzip for KMyMoney's .kmy files (M2.9): the pure-Rust backend only, so no C
# zlib is built or linked.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# Loads AqBanking and Gwenhywfar at runtime by their ABI names, so KassenSturz
# starts and works without them (D-054, D-060, D-138). Approved by the
# maintainer in M4 Phase 0.
libloading = "=0.9.0"
# Patterns in Rules (D-015): linear-time matching, so no pattern can hang the
# app.
regex = "=1.13.1"
rusqlite = { version = "=0.40.2", default-features = false }
# JSON for the complete export of a book (D-029, Q-049): written by
# KassenSturz's own code, so the keys keep the order docs/EXPORT_FORMAT.md
# shows, and read into serde_json's Value without any serde derive.
serde_json = "=1.0.154"
# Without serde: KassenSturz stores rates as two INTEGER columns (D-051).
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std"] }
uuid = { version = "=1.28.0", features = ["v7"] }
# Wipes a banking PIN from memory when it is no longer needed (D-057, threat
# T-02). Without its default features: `alloc` is enough for a wiped String.
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

# Test-only dependencies, covered by the license allowlist (D-026).
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# Hard rule 1 (AGENTS.md §3.1): no floating point for money, prices, exchange
# rates or quantities. clippy.toml blocks the libraries' floating-point methods.
float_arithmetic = "deny"
disallowed_methods = "deny"
