version = 1
SPDX-PackageName = "KassenSturz"
SPDX-PackageSupplier = "KassenSturz contributors"
SPDX-PackageDownloadLocation = "https://github.com/Vondor/KassenSturz"

# Files covered here rather than with per-file headers (D-024). Licenses
# follow KDE's licensing policy (D-064): documentation CC-BY-SA-4.0, small
# configuration files and templates CC0-1.0. Source code carries its own
# GPL-3.0-or-later header and CMake files their own BSD-2-Clause header,
# both checked by `reuse lint` the same way.
[[annotations]]
path = ["**/*.md"]
SPDX-FileCopyrightText = "2026 KassenSturz contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Listed after the documentation on purpose: the last matching entry wins,
# so the Markdown templates under .github/ are CC0-1.0 too.
[[annotations]]
path = [
  ".gitattributes",
  ".gitignore",
  "CODEOWNERS",
  ".github/**",
]
SPDX-FileCopyrightText = "2026 KassenSturz contributors"
SPDX-License-Identifier = "CC0-1.0"

# The app icon's PNG sizes, drawn from its SVG by tools/render-icons.sh. The
# SVG carries its own header (D-165).
[[annotations]]
path = ["data/icons/hicolor/**/*.png"]
SPDX-FileCopyrightText = "2026 KassenSturz contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The publisher's logo (SerpentSoftware, the maintainer's publisher name). It
# is a brand mark, not an app icon, and outside the project's licenses: it may
# be copied unmodified with the project and shown to name the publisher. The
# license text is in LICENSES/ and leaves the code licenses untouched.
[[annotations]]
path = ["docs/branding/serpentsoftware-mark.svg", "docs/branding/serpentsoftware-mark-dark.svg"]
SPDX-FileCopyrightText = "2026 SerpentSoftware"
SPDX-License-Identifier = "LicenseRef-SerpentSoftware-Logo"

# Generated from the dependency list, so there's nothing creative in them:
# Cargo's lock file, and the crate list for offline Flatpak builds that
# flatpak-cargo-generator makes from it.
[[annotations]]
path = ["Cargo.lock", "packaging/flatpak/cargo-sources.json"]
SPDX-FileCopyrightText = "2026 KassenSturz contributors"
SPDX-License-Identifier = "CC0-1.0"

# CI workflows contain scripts of their own (e.g. the DCO check), so they are
# code and use the project's code license.
[[annotations]]
path = [".github/workflows/**"]
SPDX-FileCopyrightText = "2026 KassenSturz contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Synthetic test files for the importers' golden-file tests and what they
# must give: made-up data in the formats of banks and other programs, and
# the KMyMoney sample randomized from a real book (D-102), which can't carry
# a header of their own (AGENTS.md §9, D-091).
[[annotations]]
path = ["crates/kassensturz-import/tests/golden/**"]
SPDX-FileCopyrightText = "2026 KassenSturz contributors"
SPDX-License-Identifier = "CC0-1.0"

# What the exporters must write for made-up data, compared byte for byte
# (AGENTS.md §9, D-099).
[[annotations]]
path = ["crates/kassensturz-export/tests/golden/**"]
SPDX-FileCopyrightText = "2026 KassenSturz contributors"
SPDX-License-Identifier = "CC0-1.0"

# What the MCP server must answer in a session over made-up data, as JSON
# (D-194).
[[annotations]]
path = ["crates/kassensturz-mcp/tests/golden/**"]
SPDX-FileCopyrightText = "2026 KassenSturz contributors"
SPDX-License-Identifier = "CC0-1.0"

# What the AI providers answer in the dialect tests, written by hand from
# their public documentation with made-up data (M5.11, D-206).
[[annotations]]
path = [
  "crates/kassensturz-ai/tests/dialect/fixtures/**/*.json",
  "crates/kassensturz-ai/tests/dialect/fixtures/*.txt",
]
SPDX-FileCopyrightText = "2026 KassenSturz contributors"
SPDX-License-Identifier = "CC0-1.0"
