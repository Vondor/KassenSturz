version = 1
SPDX-PackageName = "KassenSturz"
SPDX-PackageSupplier = "KassenSturz contributors"
SPDX-PackageDownloadLocation = "https://github.com/Vondor/KassenSturz"

# Documentation, project meta files and GitHub configuration are covered here
# rather than with per-file headers (D-024). Source code added from M0 onward
# carries its own SPDX-License-Identifier / SPDX-FileCopyrightText header and
# is checked by `reuse lint` the same way.
[[annotations]]
path = [
  "**/*.md",
  "LICENSE",
  ".gitignore",
  "CODEOWNERS",
  ".github/**",
]
SPDX-FileCopyrightText = "2026 KassenSturz contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
