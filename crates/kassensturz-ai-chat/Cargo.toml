[package]
name = "kassensturz-ai-chat"
description = "KassenSturz's AI chat (D-047): the conversation with a provider, the loop of the book's read functions, the number check and the tool-call log (D-190 to D-193)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["ai", "debug-log"]
# Without it the crate is empty and has no dependencies (D-039).
ai = [
    "dep:kassensturz-ai",
    "kassensturz-ai/ai",
    "dep:kassensturz-ai-tools",
    "kassensturz-ai-tools/ai",
    "dep:kassensturz-core",
    "dep:kassensturz-platform",
    "dep:kassensturz-store",
    "dep:serde_json",
]
# The developer mode's debug log (D-173, D-227). Weak, so it brings in
# nothing without `ai`.
debug-log = [
    "kassensturz-ai-tools?/debug-log",
    "kassensturz-core?/debug-log",
]

[dependencies]
kassensturz-ai = { workspace = true, optional = true }
kassensturz-ai-tools = { workspace = true, optional = true }
kassensturz-core = { workspace = true, optional = true }
kassensturz-platform = { workspace = true, optional = true }
kassensturz-store = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
kassensturz-import.workspace = true
kassensturz-pipeline.workspace = true
kassensturz-store = { workspace = true, features = ["bundled-sqlite"] }

[lints]
workspace = true
