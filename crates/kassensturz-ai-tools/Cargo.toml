[package]
name = "kassensturz-ai-tools"
description = "The fixed list of read functions an AI may call, the small overview for models without function calling, and the number check (D-052, D-170). Shared by the chat and kassensturz-mcp."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["ai", "debug-log"]
# Without it the crate is empty and has no dependencies (D-039).
ai = ["dep:kassensturz-core", "kassensturz-core/ai", "dep:kassensturz-store", "dep:regex", "dep:serde_json", "dep:uuid"]
# The function that reads the developer mode's debug log (D-173, D-227).
# Weak, so it brings in nothing without `ai`.
debug-log = ["kassensturz-core?/debug-log"]

[dependencies]
kassensturz-core = { workspace = true, optional = true }
kassensturz-store = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
kassensturz-import.workspace = true
kassensturz-pipeline.workspace = true
kassensturz-store = { workspace = true, features = ["bundled-sqlite"] }
proptest.workspace = true

[lints]
workspace = true
