[package]
name = "kassensturz-aqbanking-sys"
description = "Raw declarations of the AqBanking and Gwenhywfar C functions KassenSturz reads bank data with, loaded at runtime by their ABI names (D-060, D-138)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
libloading.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The crate's own tests load the stub library (feature `stub`) in place of
# the real AqBanking; a dependency on itself is how Cargo turns a feature
# on for tests only.
kassensturz-aqbanking-sys = { path = ".", features = ["stub"] }

[features]
# Builds the stub library of `kassensturz-aqbanking-stub` for tests that
# load it in place of the real AqBanking (threat T-09). Only for tests.
stub = []

[lints]
workspace = true
