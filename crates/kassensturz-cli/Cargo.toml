[package]
name = "kassensturz-cli"
description = "KassenSturz's command-line tool: a front end for testing the core without the UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kassensturz-cli"
path = "src/main.rs"

[features]
default = ["bundled-sqlite"]
# See kassensturz-store (D-061).
bundled-sqlite = ["kassensturz-store/bundled-sqlite"]

[dependencies]
kassensturz-core.workspace = true
kassensturz-export.workspace = true
kassensturz-import.workspace = true
kassensturz-pipeline.workspace = true
kassensturz-store.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
