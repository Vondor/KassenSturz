[package]
name = "kassensturz-core"
description = "KassenSturz's domain model: money, currencies, accounts, transactions and Rules. No UI, no storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The AI switch, read without Qt (D-013, D-168); left out of a build without
# AI (D-039).
ai = []
# The developer mode's debug log (D-173, D-227), started only from a
# terminal; a build without it holds none of its code.
debug-log = []

[dependencies]
jiff.workspace = true
regex.workspace = true
rust_decimal.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
