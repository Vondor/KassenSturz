[package]
name = "kassensturz-pipeline"
description = "KassenSturz's import pipeline: bank statements into an account of a book, with the duplicate check, Transfer suggestions, Rules and the balance check; gathering a book's transactions or the whole book for export, and filling a new book from a complete export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["bundled-sqlite"]
# See kassensturz-store (D-061).
bundled-sqlite = ["kassensturz-store/bundled-sqlite", "kassensturz-import/bundled-sqlite"]

[dependencies]
kassensturz-core.workspace = true
kassensturz-export.workspace = true
kassensturz-import.workspace = true
kassensturz-store.workspace = true

[dev-dependencies]
kassensturz-report.workspace = true

[lints]
workspace = true
