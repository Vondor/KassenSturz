[package]
name = "kassensturz-plugin-formats"
description = "Plugin importers, exporters, reports, automations and AI provider translators for plugins the host runs (#791, D-069)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# AI provider plugins (D-754, D-928), only in a build with AI (D-039).
ai = ["dep:kassensturz-ai", "kassensturz-ai/ai"]

[dependencies]
kassensturz-ai = { workspace = true, optional = true }
kassensturz-core.workspace = true
kassensturz-export.workspace = true
kassensturz-import.workspace = true
kassensturz-plugin-api.workspace = true
kassensturz-plugin-host.workspace = true
serde_json.workspace = true

[dev-dependencies]
wat.workspace = true

[lints]
workspace = true
