[package]
name = "kassensturz-store"
description = "All of KassenSturz's database code: household books stored in SQLite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["bundled-sqlite"]
# Builds the SQLite that rusqlite bundles, so every platform runs the same
# SQLite version. Distributions can leave it out to use the system's SQLite
# (D-061).
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
kassensturz-core.workspace = true
# `cache` keeps prepared statements (Q-084); it adds `hashlink`.
rusqlite = { workspace = true, features = ["cache"] }
uuid.workspace = true

[dev-dependencies]
# `trace` lets a test count the work a change costs in SQLite's own steps
# instead of clock time (D-576); it adds no crate.
rusqlite = { workspace = true, features = ["trace"] }

[lints]
workspace = true
