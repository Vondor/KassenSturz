[package]
name = "kassensturz-ui-bridge"
description = "KassenSturz's desktop app: the Kirigami UI and its cxx-qt binding to the core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kassensturz"
path = "src/main.rs"

[features]
default = ["bundled-sqlite", "ai"]
# See kassensturz-store (D-061).
bundled-sqlite = ["kassensturz-store/bundled-sqlite", "kassensturz-import/bundled-sqlite"]

# AI features (D-039): on by default, off with `--no-default-features`
# (plus `bundled-sqlite` to keep the bundled SQLite). Without it the screens
# hold no AI code and the one switch is never shown.
ai = [
    "kassensturz-core/ai",
    "dep:kassensturz-ai",
    "kassensturz-ai/ai",
    "dep:kassensturz-ai-chat",
    "kassensturz-ai-chat/ai",
    "dep:kassensturz-ai-tools",
    "kassensturz-ai-tools/ai",
]

[dependencies]
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
cxx-qt-lib-extras.workspace = true
kassensturz-ai = { workspace = true, optional = true }
kassensturz-ai-chat = { workspace = true, optional = true }
kassensturz-ai-tools = { workspace = true, optional = true }
kassensturz-bank.workspace = true
kassensturz-core.workspace = true
kassensturz-export.workspace = true
kassensturz-import.workspace = true
kassensturz-pipeline.workspace = true
kassensturz-platform.workspace = true
kassensturz-store.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
