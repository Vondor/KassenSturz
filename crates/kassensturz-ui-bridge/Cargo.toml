[package]
name = "kassensturz-ui-bridge"
description = "KassenSturz's desktop app: the Kirigami UI and its cxx-qt binding to the core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kassensturz"
path = "src/main.rs"

[features]
default = ["bundled-sqlite"]
# See kassensturz-store (D-061).
bundled-sqlite = ["kassensturz-store/bundled-sqlite", "kassensturz-import/bundled-sqlite"]

[dependencies]
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
cxx-qt-lib-extras.workspace = true
kassensturz-core.workspace = true
kassensturz-import.workspace = true
kassensturz-pipeline.workspace = true
kassensturz-store.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
