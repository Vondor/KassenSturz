# cargo-deny's checks, run in CI (D-026). Direct dependencies are approved one
# by one and listed in docs/THIRD_PARTY.md; this allowlist covers the indirect
# and test-only ones. Changing it is a dependency change that needs the
# maintainer's approval (AGENTS.md §3.2).

[graph]
all-features = true

[licenses]
# The allowlist from docs/THIRD_PARTY.md. MPL-2.0 is only fine for files not
# marked "Incompatible With Secondary Licenses", which cargo-deny can't see:
# check that by hand when an MPL-2.0 crate shows up.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
]
# Test-only dependencies are covered too (D-026); cargo-deny skips them by
# default.
include-dev = true
# The list is a policy, not an inventory of what's in use today.
unused-allowed-license = "allow"

[licenses.private]
# KassenSturz's own crates (GPL-3.0-or-later, D-001) are never published.
ignore = true

[sources]
# Crates come from crates.io only. A git dependency or another registry would
# need its own decision first.
unknown-registry = "deny"
unknown-git = "deny"
